<style>
/* -----------------------------------------------------------------------------
 * Only what belongs to the VINTAGE and to no other passport. Everything shared
 * lives in src/cap/passport-canon.css and is NOT re-declared here.
 *
 * Two things are this page's own: the harvest year at display size — it is the
 * subject of this document, not a line in it — and the blend bars, which no
 * other passport draws. Nothing bottle-specific (token, copy number, scan
 * counter, provenance) may ever appear here.
 * --------------------------------------------------------------------------*/
.vt-year{font-family:var(--serif);font-weight:500;font-size:clamp(38px,9vw,52px);line-height:1;
  margin:0;letter-spacing:-0.02em;color:var(--cream)}
.vt-wine{font-size:15px;color:rgba(245,240,232,0.65)}
.vt-wine a{color:rgba(245,240,232,0.8)}

/* The blend: one bar per grape, read from cap_vintages.grape_composition. */
.blend{display:flex;flex-direction:column;gap:14px;max-width:560px}
.blend-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.blend-name{font-family:var(--serif);font-size:16px;color:var(--cream)}
.blend-pct{font-family:var(--mono);font-size:11.5px;color:rgba(245,240,232,0.55)}
.blend-bar{height:4px;background:rgba(197,165,114,0.12);border-radius:100px;overflow:hidden}
.blend-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:100px}
</style>

<main id="app"></main>

<footer class="foot" id="foot"></footer>

<script>
/* -----------------------------------------------------------------------------
 * CAP-PASSPORT-FAMILY-CANON-01 — the vintage passport in the approved design
 * system. The REQUEST CONTRACT IS UNCHANGED: same endpoint
 * (GET {API}/vintages/{vintageId}), same parameters (?vintageId=, optional
 * ?winerySlug=), same permanent public link (vintage-passport.html?vintageId=…).
 *
 * Every value comes from a column the route really selects — verified in
 * tt-stack api/src/routes/cap.ts, GET /api/cap/vintages/:vintageId: vintage_year,
 * abv, grape_composition, bottles_produced, release_date, production_notes,
 * tasting_notes, ean_upc, bottle_image_url, wine_id, wine_name, color,
 * sweetness, grape_varieties. An empty field hides its row.
 *
 * NO TRUST BADGE HERE. `verification_status` is in the payload and is
 * deliberately not rendered: the "Producer-asserted" claim belongs to the
 * producer's own band, which this page does not carry — the winery is one click
 * up the chain. The canon's rule (docs/design/canon/passport/README.md) is that
 * nothing on these pages claims a verification we have not performed.
 *
 * The breadcrumb chain starts at the WINE, not the winery: this route returns
 * the wine's name but not the winery's, so a winery crumb could only be
 * labelled with a slug. The winery is reachable from the link row below.
 * --------------------------------------------------------------------------*/
const qs = new URLSearchParams(location.search);
const vintageId = (qs.get('vintageId') || '').trim();
const winerySlug = (qs.get('winerySlug') || qs.get('slug') || '').trim();
const lang = CAP.lang;
const t = CAP.t;
const API = qs.get('api') || (/^(localhost|127\.|0\.0)/.test(location.hostname) ? 'http://localhost:8088/api/cap' : 'https://tt-stack-prod.onrender.com/api/cap');
const lp = lang === 'en' ? '' : ('&lang=' + lang);
const ap = qs.get('api') ? ('&api=' + encodeURIComponent(qs.get('api'))) : '';
const keep = lp + ap;
const wineryQs = () => winerySlug ? ('&winerySlug=' + encodeURIComponent(winerySlug)) : '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz = v => { const s = (v == null ? '' : String(v)).trim(); return s ? s : null; };

/* The canon's Bordeaux silhouette, inlined verbatim from
   docs/design/canon/passport/assets/bottle-bordeaux-lg-transparent.svg
   (tt-mobile). A PLACEHOLDER, held small by the canon stylesheet: it only
   appears when the producer has supplied no bottle photograph. */
const BOTTLE_SVG = `<svg viewBox="0 0 120 360" role="img" aria-hidden="true" style="width:auto;">
  <path d="M43.2,0 L76.8,0 C76.8,39.6 78,67.32 78,79.2 C78,96.21 116.4,96.21 116.4,117 L116.4,345.6 C116.4,351.36 114,355.68 114,352.8 Q114,360 106.8,360 L13.2,360 Q6,360 6,352.8 C6,355.68 3.6,351.36 3.6,345.6 L3.6,117 C3.6,96.21 42,96.21 42,79.2 C42,67.32 43.2,39.6 43.2,0 Z"
        fill="none" stroke="#C5A572" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
  <path d="M42.74,30.6 L77.26,30.6" fill="none" stroke="#C5A572" stroke-width="1.6" stroke-linecap="round"></path>
  <rect x="24" y="183.3" width="72" height="96" fill="none" stroke="#C5A572" stroke-width="1.12" stroke-dasharray="4 2.4"></rect>
</svg>`;

function setCrumbs(parts) {
  document.getElementById('crumbs').innerHTML = parts.map((p, i) =>
    (i ? '<span class="crumb-sep">/</span>' : '') +
    (p.href ? `<a href="${p.href}">${esc(p.label)}</a>`
            : `<span class="${p.current ? 'crumb-current' : ''}">${esc(p.label)}</span>`)
  ).join('');
}

function enumLabel(prefix, raw) {
  const s = nz(raw); if (!s) return null;
  const key = prefix + '_' + s.toLowerCase();
  const out = t(key);
  return out === key ? s : out;
}

/* Month and year in the guest's language. The DATE column serializes as a full
   ISO timestamp, so only the date part is read. */
function fmtDate(raw) {
  const s = nz(raw); if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return s;
  try {
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return new Intl.DateTimeFormat(lang === 'ka' ? 'ka-GE' : lang, { month: 'short', year: 'numeric', timeZone: 'UTC' }).format(d);
  } catch (e) { return `${m[2]}.${m[1]}`; }
}
/* `abv` arrives as a numeric string. */
function fmtAbv(raw) {
  const s = nz(raw); if (!s) return null;
  const n = Number(s);
  return isNaN(n) ? s : String(n);
}

function facts(v) {
  const out = [];
  const abv = fmtAbv(v.abv);
  if (abv) out.push([t('abv'), abv + '%']);
  if (v.bottles_produced != null && String(v.bottles_produced).trim() !== '') {
    out.push([t('total_bottles'), String(v.bottles_produced)]);
  }
  const rel = fmtDate(v.release_date);
  if (rel) out.push([t('wn_released'), rel]);
  const ean = nz(v.ean_upc);
  if (ean) out.push([t('vt_fact_ean'), ean]);
  return out;
}

/* `grape_composition` is a JSONB column: either {name: pct} or
   [{name, pct}]. Anything else, or a zero share, is dropped. */
function parseBlend(gc) {
  if (!gc || typeof gc === 'string') return [];
  let entries = [];
  if (Array.isArray(gc)) {
    entries = gc.map(g => [nz(g && g.name), Number(g && g.pct)]);
  } else if (typeof gc === 'object') {
    entries = Object.keys(gc).map(k => [nz(k), Number(gc[k])]);
  }
  return entries
    .filter(([name, pct]) => !!name && !isNaN(pct) && pct > 0)
    .map(([name, pct]) => ({ name, pct: Math.min(100, pct) }));
}

/* ---------- states -------------------------------------------------------- */
function stateScreen({ icon, kick, title, body, note, actions }) {
  document.getElementById('ctx-label').textContent = t('vt_ctx_loading');
  document.getElementById('app').innerHTML = `
    <div class="state fade-in">
      ${icon || ''}
      <div class="state-kick">${kick}</div>
      <h1 class="state-title">${title}</h1>
      ${body ? `<p class="state-body">${body}</p>` : ''}
      ${note ? `<p class="state-note">${note}</p>` : ''}
      ${actions || ''}
    </div>`;
  document.getElementById('foot').textContent = 'CAP · Tasting & Toasting';
}
const exploreLink = `<a class="xlink" href="https://tastingandtoasting.com">${t('wp_explore')}</a>`;

function renderLoading() {
  document.getElementById('ctx-label').textContent = t('vt_ctx_loading');
  document.getElementById('app').innerHTML =
    `<div class="state"><div class="state-kick">${t('loading')}</div></div>`;
}
function renderNotFound() {
  stateScreen({ kick: t('vt_nf_kick'), title: t('vt_nf_title'), body: t('vt_nf_body'),
    actions: `<div class="links">${exploreLink}</div>` });
}
function renderError() {
  stateScreen({ kick: t('vt_err_kick'), title: t('vt_err_title'), body: t('vt_err_body'),
    actions: `<div class="links"><button class="btn" id="retry-btn">${t('vt_retry')}</button></div>` });
  document.getElementById('retry-btn').addEventListener('click', () => load());
}

/* ---------- the passport -------------------------------------------------- */
function renderPassport(v) {
  document.getElementById('ctx-label').textContent = t('vt_ctx_ready');

  const wineName = nz(v.wine_name);
  const wineHref = nz(v.wine_id)
    ? `wine-passport.html?wineId=${encodeURIComponent(v.wine_id)}${wineryQs()}${keep}` : null;
  const wineryHref = winerySlug
    ? `winery-passport.html?slug=${encodeURIComponent(winerySlug)}${keep}` : null;

  setCrumbs([
    ...(wineName ? [{ label: wineName, href: wineHref }] : []),
    ...(v.vintage_year != null ? [{ label: String(v.vintage_year), current: true }] : []),
  ]);

  const hero = nz(v.bottle_image_url);
  const chips = [enumLabel('color', v.color), enumLabel('sweet', v.sweetness)].filter(Boolean);
  const grapes = (v.grape_varieties || []).map(nz).filter(Boolean);

  const f = facts(v);
  const prodNotes = nz(v.production_notes);
  const tasteNotes = nz(v.tasting_notes);
  const productionBand = (f.length || prodNotes || tasteNotes) ? `
    <section class="band">
      <div class="eyebrow">${t('vt_sec_production')}</div>
      ${f.length ? `<div class="facts">${f.map(([k, val]) => `
        <div><div class="fact-k">${esc(k)}</div><div class="fact-v">${esc(val)}</div></div>`).join('')}</div>` : ''}
      ${prodNotes ? `<p class="prose">${esc(prodNotes)}</p>` : ''}
      ${tasteNotes ? `<div style="margin-top:24px">
        <div class="fact-k">${t('vt_tasting_label')}</div>
        <blockquote class="prose-quote" style="margin-top:8px">${esc(tasteNotes)}</blockquote>
      </div>` : ''}
    </section>` : '';

  const blend = parseBlend(v.grape_composition);
  const blendBand = blend.length ? `
    <section class="band">
      <div class="eyebrow">${t('vt_blend_label')}</div>
      <div class="blend">${blend.map(g => `
        <div>
          <div class="blend-head">
            <span class="blend-name">${esc(g.name)}</span>
            <span class="blend-pct">${esc(g.pct)}%</span>
          </div>
          <div class="blend-bar"><div class="blend-fill" style="width:${esc(g.pct)}%"></div></div>
        </div>`).join('')}
      </div>
    </section>` : '';

  const xlinks = [
    wineHref ? `<a class="xlink" href="${wineHref}">${t('back_wine')} →</a>` : '',
    wineryHref ? `<a class="xlink" href="${wineryHref}">${t('back_winery')} →</a>` : '',
  ].filter(Boolean).join('');

  document.getElementById('app').innerHTML = `
    <article class="fade-in">
      <section class="hero">
        <div class="plate ${hero ? 'has-photo' : 'no-photo'}">${hero ? `<img src="${esc(hero)}" alt="${esc(wineName || '')}">` : BOTTLE_SVG}</div>
        <div class="identity">
          <div class="eyebrow eyebrow-strong" style="margin:0">${t('bp_sec_vintage')}</div>
          <h1 class="vt-year">${esc(v.vintage_year)}</h1>
          ${wineName ? `<div class="vt-wine">${wineHref ? `<a href="${wineHref}">${esc(wineName)}</a>` : esc(wineName)}</div>` : ''}
          ${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}
          ${grapes.length ? `<div class="grapes">${grapes.map(g => `<span class="grape">${esc(g)}</span>`).join('')}</div>` : ''}
        </div>
      </section>

      ${productionBand}
      ${blendBand}

      ${xlinks ? `<section class="band"><div class="links">${xlinks}</div></section>` : ''}
    </article>`;

  document.getElementById('foot').textContent = 'CAP · Tasting & Toasting';
}

/* The parent wine is temporarily closed for an update
   (CAP-PASSPORT-AVAILABILITY-CONTROL-03). A vintage carries its wine's name, so
   this door closes with the wine — but it says so in the wine passport's own
   words instead of claiming the vintage does not exist. */
function renderUnavailable() {
  stateScreen({ icon: CAP.dimIcon, kick: t('wn_un_kick'), title: t('wn_un_title'),
    body: t('wn_un_body'), note: t('wn_un_note') });
}

async function load() {
  if (!vintageId) { renderNotFound(); return; }
  renderLoading();
  let data;
  try {
    const r = await fetch(`${API}/vintages/${encodeURIComponent(vintageId)}`);
    if (r.status === 404 || r.status === 400) { renderNotFound(); return; }
    if (!r.ok) { renderError(); return; }
    data = await r.json();
  } catch (e) { renderError(); return; }
  if (data && data.availability === 'temporarily_unavailable') { renderUnavailable(); return; }
  if (!data || !data.vintage) { renderNotFound(); return; }
  renderPassport(data.vintage);
}

CAP.wireSwitcher();
CAP.applyStatic();
load();
</script>
</body>
