<!DOCTYPE html>
<html lang="en">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root{--bg:#1A0B08;--cream:#F5F0E8;--gold:#C5A572;--dim:#8B7548;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#1A0B08;color:#F5F0E8;font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
body{overflow-x:auto;}
img,svg{max-width:100%;}
a{color:#C5A572;text-decoration:none;}
a:hover{color:#F5F0E8;}
button{font-family:inherit;}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px clamp(16px,4vw,48px);border-bottom:1px solid rgba(197,165,114,0.16);flex-wrap:wrap;position:sticky;top:0;z-index:40;background:rgba(26,11,8,0.92);backdrop-filter:blur(10px);}
.cap{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:0.02em;color:#C5A572;flex:0 0 auto;}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;flex:1 1 180px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(245,240,232,0.5);}
.crumb a{color:rgba(245,240,232,0.5);}
.crumb a:hover{color:#F5F0E8;}
.crumb .here{color:#C5A572;overflow-wrap:anywhere;}
.sep{color:rgba(197,165,114,0.4);}
.lang-switcher{flex:1 1 220px;display:flex;justify-content:flex-end;min-width:0;}
.lang-switcher-flags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;max-width:100%;}
.lang-flag-link{display:inline-flex;align-items:center;justify-content:center;width:30px;height:20px;border-radius:3px;overflow:hidden;border:1px solid rgba(197,165,114,0.28);opacity:.78;}
.lang-flag-link:hover{opacity:1;}
.lang-flag-link.is-current-lang{opacity:1;border-color:#C5A572;box-shadow:0 0 0 1px rgba(197,165,114,0.35);}
.lang-flag-link svg{width:100%;height:100%;display:block;}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));border-bottom:1px solid rgba(197,165,114,0.16);}
.plate{background:radial-gradient(ellipse at center, rgba(43,24,16,0.9), #0F0507 75%);padding:clamp(28px,6vw,56px) clamp(16px,4vw,48px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0;}
.copy{padding:clamp(28px,6vw,56px) clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0;}
.kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#8B7548;}
h1{font-family:'Fraunces',serif;font-weight:500;line-height:1.05;margin:0;overflow-wrap:anywhere;}
.wine-name{font-size:clamp(32px,5vw,44px);}
.year-name{font-size:clamp(42px,10vw,52px);line-height:1;}
.wine-sub{font-size:15px;color:rgba(245,240,232,0.65);overflow-wrap:anywhere;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(197,165,114,0.3);border-radius:2px;color:rgba(245,240,232,0.7);}
.grapes{display:flex;gap:6px 10px;flex-wrap:wrap;}
.grapes span{font-size:11px;color:#C5A572;}
.appel{font-size:13px;color:rgba(245,240,232,0.55);overflow-wrap:anywhere;}
.desc{font-size:15px;line-height:1.6;color:rgba(245,240,232,0.75);margin:6px 0 0;}
.quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;line-height:1.5;color:#C5A572;margin:8px 0 0;padding-left:20px;border-left:2px solid rgba(197,165,114,0.4);}
.tasting{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.55;color:#C5A572;margin:0;max-width:640px;}
.notes{font-size:14px;line-height:1.6;color:rgba(245,240,232,0.65);margin:28px 0 0;max-width:640px;}
.by{margin-top:10px;font-size:13px;color:rgba(245,240,232,0.55);overflow-wrap:anywhere;}
.by:hover{color:#F5F0E8;}
.vs{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 12px;border:1px solid rgba(197,165,114,0.5);border-radius:2px;color:#C5A572;}
.place{display:flex;flex-direction:column;gap:14px;margin-top:4px;}
.place .k{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(245,240,232,0.4);margin-bottom:6px;}
.place .v{font-family:'JetBrains Mono',monospace;font-size:14px;color:#F5F0E8;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;}
.flag{display:inline-flex;width:16px;height:11px;border:1px solid rgba(197,165,114,0.35);overflow:hidden;flex:0 0 auto;}
.flag svg{width:16px;height:11px;display:block;}
.sec{padding:clamp(36px,6vw,64px) clamp(16px,4vw,48px);border-bottom:1px solid rgba(197,165,114,0.12);min-width:0;}
.sec h2{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#8B7548;margin:0 0 28px;font-weight:400;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px;}
.card{display:block;border:1px solid rgba(197,165,114,0.22);border-radius:2px;padding:22px 24px;min-width:0;}
.card:hover{border-color:rgba(197,165,114,0.55);color:inherit;}
.card .y{font-family:'Fraunces',serif;font-size:26px;color:#F5F0E8;margin-bottom:6px;}
.card .m{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(245,240,232,0.45);overflow-wrap:anywhere;}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:24px;}
.fact .k{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(245,240,232,0.4);margin-bottom:6px;}
.fact .v{font-family:'JetBrains Mono',monospace;font-size:16px;color:#F5F0E8;overflow-wrap:anywhere;}
.fact .v.small{font-size:14px;}
.tasting-wrap{margin-top:24px;}
.tasting-wrap .k{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(245,240,232,0.4);margin-bottom:8px;}
.actions{padding:40px clamp(16px,4vw,48px);border-bottom:1px solid rgba(197,165,114,0.12);display:flex;gap:12px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border:1px solid rgba(197,165,114,0.4);border-radius:2px;font-size:13px;color:#C5A572;background:transparent;cursor:pointer;}
.btn:hover{color:#F5F0E8;border-color:#C5A572;}
.arrow{display:inline-block;}
.state{min-height:64vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px;gap:18px;}
.state h1{font-size:clamp(26px,5vw,32px);max-width:520px;line-height:1.3;}
.state p{font-size:14px;color:rgba(245,240,232,0.55);max-width:440px;margin:0;}
.state .kicker{color:rgba(197,165,114,0.6);}
.empty{border:1px dashed rgba(197,165,114,0.3);border-radius:2px;padding:28px 32px;max-width:460px;}
.empty .t{font-family:'Fraunces',serif;font-size:20px;margin-bottom:6px;}
.empty .s{font-size:13px;color:rgba(245,240,232,0.55);}
.photo-block{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:460px;}
.frame{position:relative;width:min(100%,460px);height:340px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(197,165,114,0.16);border-radius:2px;background:rgba(197,165,114,0.03);padding:12px;cursor:zoom-in;color:inherit;}
.frame img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
.enlarge{position:absolute;right:10px;bottom:10px;padding:4px 10px;border:1px solid rgba(197,165,114,0.45);border-radius:2px;background:rgba(15,5,7,0.78);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#C5A572;opacity:0;transition:opacity .15s;}
.frame:hover .enlarge,.frame:focus-visible .enlarge{opacity:1;}
@media (hover:none){.enlarge{opacity:1;}}
.credit,.photo-pos{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:16px;color:rgba(245,240,232,0.62);text-align:center;overflow-wrap:anywhere;}
.photo-pos{font-size:10px;color:rgba(245,240,232,0.4);}
.thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:100%;}
.thumb{width:54px;height:54px;padding:4px;border:1px solid rgba(197,165,114,0.22);border-radius:2px;background:rgba(197,165,114,0.04);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.thumb.is-on{border-color:#C5A572;}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;}
.sil{display:flex;align-items:center;justify-content:center;}
.sil svg{height:100%;width:auto;display:block;}
.sil-lg{height:340px;}
.sil-md{height:280px;}
.sil-anon{height:200px;opacity:0.8;}
.skel{padding:52px clamp(16px,4vw,48px);}
.bar{height:14px;border-radius:2px;background:rgba(197,165,114,0.14);animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}
.lb{position:fixed;inset:0;z-index:80;background:rgba(15,5,7,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:64px 16px;}
.lb[hidden]{display:none;}
.lb img{max-width:min(100%,920px);max-height:calc(100vh - 160px);width:auto;height:auto;object-fit:contain;}
.lb-x{position:absolute;top:16px;right:16px;width:44px;height:44px;border:1px solid rgba(197,165,114,0.45);background:transparent;color:#C5A572;font-size:22px;cursor:pointer;line-height:1;}
.lb .credit{max-width:640px;}
html[dir="rtl"] .top{flex-direction:row-reverse;}
html[dir="rtl"] .crumb{flex-direction:row-reverse;}
html[dir="rtl"] .lang-switcher{justify-content:flex-start;}
html[dir="rtl"] .lang-switcher-flags{flex-direction:row-reverse;}
html[dir="rtl"] .quote{border-left:none;border-right:2px solid rgba(197,165,114,0.4);padding-left:0;padding-right:20px;}
html[dir="rtl"] .arrow{transform:scaleX(-1);}
html[dir="rtl"] .lb-x{right:auto;left:16px;}
html[dir="rtl"] .enlarge{right:auto;left:10px;}
@media (max-width:600px){
  .frame{height:240px;}
  .sil-lg{height:240px;}
  .sil-md{height:210px;}
  .quote{font-size:20px;}
}

</style>

      if (typeof item === 'string' && item.trim()) parts.push(item.trim());
      else if (item && typeof item === 'object') {
        const name = nonEmpty(item.name || item.variety);
        const pct = item.pct != null ? item.pct : item.percentage;
        if (!name) return;
        if (pct == null || String(pct).trim() === '') parts.push(name);
        else {
          const share = String(pct).trim();
          parts.push(name + ' ' + (share.endsWith('%') ? share : share + '%'));
        }
      }
    });
    return parts.join(', ');
  }
  if (typeof gc === 'object') {
    const parts = [];
    Object.keys(gc).forEach(k => {
      const val = gc[k];
      if (!nonEmpty(k) || val == null || String(val).trim() === '') return;
      const share = String(val).trim();
      parts.push(k.trim() + ' ' + (share.endsWith('%') || !Number.isFinite(Number(share)) ? share : share + '%'));
    });
    return parts.join(', ');
  }
  return '';
}
function setCrumb(parts) {
  const el = document.getElementById('crumb');
  const bits = [];
  parts.forEach(p => {
    if (!p || !p.text) return;
    if (bits.length) bits.push('<span class="sep">/</span>');
    if (p.href) bits.push('<a href="' + esc(p.href) + '">' + esc(p.text) + '</a>');
    else bits.push('<span class="here">' + esc(p.text) + '</span>');
  });
  el.innerHTML = bits.join('');
}
function renderState(kind, titleKey, bodyKey, extra) {
  setCrumb([]);
  document.getElementById('app').innerHTML =
    '<div class="state" data-state="' + kind + '">' +
    (extra || '') +
    '<div class="kicker">' + esc(L(kind === 'error' ? 'err' : kind === 'draft' ? 'draft' : 'nf')) + '</div>' +
    '<h1>' + esc(L(titleKey)) + '</h1>' +
    '<p>' + esc(L(bodyKey)) + '</p>' +
    (kind === 'error'
      ? '<button type="button" class="btn" id="retry-btn">' + esc(L('retry')) + '</button>'
      : '<a class="btn" href="https://tastingandtoasting.com">' + esc(L('explore')) + '<span class="arrow" aria-hidden="true">→</span></a>') +
    '</div>';
}
function renderLoading() {
  setCrumb([]);
  document.getElementById('app').innerHTML = '<div class="skel" data-state="loading"><div class="bar" style="width:28%;margin-bottom:18px"></div><div class="bar" style="width:52%;height:42px;background:rgba(245,240,232,0.07)"></div></div>';
}
document.getElementById('app').addEventListener('click', function (e) {
  if (e.target.closest('[data-open-photo]')) { openLb(); return; }
  const th = e.target.closest('[data-photo-i]');
  if (th) { photoIndex = Number(th.getAttribute('data-photo-i')) || 0; if (saved) renderCurrent(); return; }
  if (e.target.closest('#retry-btn')) load();
});
document.addEventListener('error', function (e) {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.getAttribute('data-photo')) return;
  const src = img.getAttribute('src');
  if (!src || deadPhotos[src]) return;
  deadPhotos[src] = 1;
  photoIndex = 0;
  closeLb();
  if (saved) renderCurrent();
}, true);
document.getElementById('lb').addEventListener('click', function (e) {
  if (e.target.id === 'lb' || e.target.closest('.lb-x')) closeLb();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeLb();
});


const wineId = (qs.get('wineId') || '').trim();
const winerySlugQs = (qs.get('winerySlug') || qs.get('slug') || '').trim();
function renderCurrent() { if (saved) renderPassport(saved.w, saved.vs); }
function renderNotFound() { renderState('404', 'nf_title', 'nf_body', ''); }
function renderError() { renderState('error', 'err_wine', 'err_body', ''); }
function renderDraft() {
  renderState('draft', 'draft_wine', 'draft_body', '<div class="sil sil-anon">' + SIL_ANON + '</div>');
}
function placeRows(w) {
  const rows = [];
  const country = nonEmpty(w.winery_country);
  const address = nonEmpty(w.winery_address);
  const locality = nonEmpty(w.winery_locality);
  if (country) rows.push([L('country'), flagHtml(country) + '<span>' + esc(country) + '</span>']);
  if (address) rows.push([L('address'), '<span>' + esc(address) + '</span>']);
  if (locality) rows.push([L('locality'), '<span>' + esc(locality) + '</span>']);
  if (!rows.length) return '';
  return '<div class="place">' + rows.map(r => '<div><div class="k">' + esc(r[0]) + '</div><div class="v">' + r[1] + '</div></div>').join('') + '</div>';
}
function renderPassport(w, vintages) {
  saved = { w: w, vs: vintages || [] };
  const slug = nonEmpty(w.winery_slug) || winerySlugQs;
  const wineryName = nonEmpty(w.winery_name);
  const name = nonEmpty(w.name);
  document.title = name + ' · CAP';
  const crumb = [];
  if (wineryName) crumb.push({ text: wineryName, href: slug ? href('winery-passport', { slug: slug }) : '' });
  crumb.push({ text: name });
  setCrumb(crumb);
  const chips = [];
  const color = enumLabel('color', w.color);
  const sweet = enumLabel('sweet', w.sweetness);
  const style = nonEmpty(w.style);
  if (color) chips.push(color);
  if (sweet) chips.push(sweet);
  if (style) chips.push(style);
  const grapes = (Array.isArray(w.grape_varieties) ? w.grape_varieties : []).map(nonEmpty).filter(Boolean);
  const appellation = nonEmpty(w.appellation);
  const desc = nonEmpty(w.description);
  const story = nonEmpty(w.story_text);
  const vsLabel = statusView(w.verification_status);
  const photoUrls = [w.hero_image_url].concat((vintages || []).map(v => v && v.bottle_image_url));
  const list = (vintages || []).filter(v => v && v.id != null && v.vintage_year != null && String(v.vintage_year).trim() !== '');
  list.sort((a, b) => Number(b.vintage_year) - Number(a.vintage_year));
  const cards = list.map(v => {
    const meta = [];
    if (v.bottles_produced != null && String(v.bottles_produced).trim() !== '') meta.push(esc(String(v.bottles_produced)) + ' ' + esc(t('bottles')));
    const rel = formatDate(v.release_date);
    if (rel) meta.push(esc(fill(L('released'), { date: rel })));
    return '<a class="card" href="' + esc(href('vintage-passport', { vintageId: v.id, winerySlug: slug })) + '"><div class="y">' + esc(v.vintage_year) + '</div>' +
      meta.map(m => '<div class="m">' + m + '</div>').join('') + '</a>';
  }).join('');
  const vintageBlock = list.length
    ? '<div class="cards">' + cards + '</div>'
    : '<div class="empty"><div class="t">' + esc(L('empty_title')) + '</div><div class="s">' + esc(L('empty_sub')) + '</div></div>';
  const by = wineryName
    ? (slug
        ? '<a class="by" href="' + esc(href('winery-passport', { slug: slug })) + '">' + esc(fill(L('by'), { name: wineryName })) + ' <span class="arrow" aria-hidden="true">→</span></a>'
        : '<div class="by">' + esc(fill(L('by'), { name: wineryName })) + '</div>')
    : '';
  document.getElementById('app').innerHTML =
    '<article data-state="ready">' +
      '<div class="hero"><div class="plate">' + photoBlock(photoUrls, SIL_LG, 'sil-lg') + '</div>' +
      '<div class="copy">' +
        '<div class="kicker">' + esc(L('wine')) + '</div>' +
        '<h1 class="wine-name">' + esc(name) + '</h1>' +
        (chips.length ? '<div class="chips">' + chips.map(c => '<span class="chip">' + esc(c) + '</span>').join('') + '</div>' : '') +
        (appellation ? '<div class="appel">' + esc(appellation) + '</div>' : '') +
        (grapes.length ? '<div class="grapes">' + grapes.map(g => '<span>' + esc(g) + '</span>').join('') + '</div>' : '') +
        (desc ? '<p class="desc">' + esc(desc) + '</p>' : '') +
        (story ? '<blockquote class="quote">“' + esc(story) + '”</blockquote>' : '') +
        by +
        (vsLabel ? '<div class="vs">' + esc(L('vs')) + ': ' + esc(vsLabel) + '</div>' : '') +
        placeRows(w) +
      '</div></div>' +
      '<section class="sec"><h2>' + esc(L('vintages')) + '</h2>' + vintageBlock + '</section>' +
    '</article>';
}
async function load() {
  deadPhotos = Object.create(null);
  photoIndex = 0;
  closeLb();
  saved = null;
  if (!wineId) { renderNotFound(); return; }
  renderLoading();
  let data;
  try {
    const r = await fetch(API + '/wines/' + encodeURIComponent(wineId));
    if (r.status === 404 || r.status === 400) { renderNotFound(); return; }
    if (!r.ok) { renderError(); return; }
    data = await r.json();
  } catch (e) { renderError(); return; }
  const w = data && data.wine;
  if (!w || !nonEmpty(w.name)) { renderNotFound(); return; }
  if (w.id && w.id !== wineId) { renderNotFound(); return; }
  if (w.status === 'draft') { renderDraft(); return; }
  renderPassport(w, Array.isArray(data.vintages) ? data.vintages : []);
}
CAP.wireSwitcher();
CAP.applyStatic();
document.getElementById('lb-x').setAttribute('aria-label', L('close'));
load();

</script>
