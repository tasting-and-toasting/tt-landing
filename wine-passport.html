<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Passport · Tasting &amp; Toasting CAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="src/i18n/cap-i18n.js"></script>
<style>
/* =============================================================================
 * WINE PASSPORT — P2 of the CAP passport canon.
 *
 * Visual system: the approved public bottle passport (tt-mobile app/v2/cap/bottle.tsx,
 * itself a re-expression of docs/design/canon/passport/BottleScan.dc.html).
 * Structure: docs/design/canon/passport/WinePassport.dc.html.
 *
 * FOUR TYPEFACES, EACH WITH ONE JOB — the canon's rule, not a preference:
 *   Fraunces              structure (names, years, section titles that are titles)
 *   JetBrains Mono        metadata (eyebrows, breadcrumbs, counts, dates)
 *   Cormorant Garamond    the human voice ONLY (the wine's story)
 *   Inter                 running text
 * The passport is ALWAYS DARK and does not follow any theme: a guest who scans a
 * QR has never opened the app, and a light default would hand them a washed-out
 * document.
 * ===========================================================================*/
:root{
  --bg:#1A0B08;          /* walnut ground — the approved passport's background */
  --deep:#0F0507;        /* the hero plate's darkest point */
  --plate:#2B1810;       /* plate glow */
  --cream:#F5F0E8;
  --gold:#C5A572;
  --gold-soft:#E0C48E;
  --gold-dim:#8B7548;    /* eyebrows */
  --line:rgba(197,165,114,0.16);
  --line-soft:rgba(197,165,114,0.12);
  --serif:"Fraunces",Georgia,serif;
  --voice:"Cormorant Garamond",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --pad:20px;            /* 20 / 32 / 48 by viewport, as the approved passport */
}
@media(min-width:600px){:root{--pad:32px}}
@media(min-width:900px){:root{--pad:48px}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:400;line-height:1.6;
     -webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-soft)}
img{max-width:100%}

/* ---- header: wordmark left, breadcrumb chain right, languages below ------ */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px var(--pad);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;
  background:rgba(26,11,8,0.86);backdrop-filter:blur(10px);}
.brandbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark{width:26px;height:26px;border:1px solid rgba(197,165,114,0.45);border-radius:2px;display:flex;
  align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:13px;color:var(--gold);}
.brandname{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0.02em;color:var(--gold);white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;
  font-family:var(--mono);font-size:11px;letter-spacing:0.02em;color:rgba(245,240,232,0.5);}
.crumbs a{color:rgba(245,240,232,0.5)}
.crumbs a:hover{color:var(--gold-soft)}
.crumb-sep{color:rgba(197,165,114,0.4)}
.crumb-current{color:var(--gold)}
.ctx{font-family:var(--mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(245,240,232,0.38)}
.lang-switcher-flags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lang-flag-link{width:20px;height:13px;display:block;opacity:0.45;border-radius:1px;overflow:hidden;line-height:0;
  transition:opacity .15s,box-shadow .15s}
.lang-flag-link svg{width:100%;height:100%;display:block}
.lang-flag-link:hover{opacity:0.9}
.lang-flag-link.is-current-lang{opacity:1;box-shadow:0 0 0 1px var(--gold)}

/* ---- bands: full-width sections divided by a gold hairline --------------- */
.band{padding:40px var(--pad);border-bottom:1px solid var(--line-soft)}
.band:last-child{border-bottom:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0.24em;text-transform:uppercase;
  color:var(--gold-dim);margin:0 0 20px}
.eyebrow-strong{color:var(--gold)}
.eyebrow-muted{color:rgba(245,240,232,0.35)}

/* ---- hero: plate + identity, two columns on a wide screen --------------- */
.hero{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--line)}
@media(min-width:820px){.hero{grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr)}}
.plate{background:radial-gradient(ellipse at center,rgba(43,24,16,0.92),var(--deep) 74%);
  padding:40px var(--pad);display:flex;align-items:center;justify-content:center;min-height:260px}
.plate img{height:clamp(190px,42vw,330px);width:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,0.5))}
.identity{padding:36px var(--pad);display:flex;flex-direction:column;gap:14px;justify-content:center}
.wine-name{font-family:var(--serif);font-weight:500;font-size:clamp(30px,7vw,44px);line-height:1.05;margin:0;
  letter-spacing:-0.012em;color:var(--cream)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;
  border:1px solid rgba(197,165,114,0.3);border-radius:2px;color:rgba(245,240,232,0.72)}
.appellation{font-size:13px;color:rgba(245,240,232,0.55)}
.grapes{display:flex;gap:10px;flex-wrap:wrap}
.grape{font-size:11.5px;color:var(--gold)}
.desc{font-size:15px;line-height:1.62;color:rgba(245,240,232,0.75);margin:6px 0 0;max-width:62ch}
.story{font-family:var(--voice);font-style:italic;font-size:clamp(19px,3.4vw,22px);line-height:1.5;color:var(--gold);
  margin:10px 0 0;padding-left:18px;border-left:2px solid rgba(197,165,114,0.4)}
html[dir="rtl"] .story{padding-left:0;padding-right:18px;border-left:0;border-right:2px solid rgba(197,165,114,0.4)}
.byline{margin-top:8px;font-size:13px;color:rgba(245,240,232,0.55)}
.byline a{color:rgba(245,240,232,0.72)}

/* ---- producer band ------------------------------------------------------ */
.producer-name{font-family:var(--serif);font-weight:500;font-size:clamp(22px,4.4vw,28px);margin:0 0 8px;color:var(--cream)}
.producer-place{font-family:var(--mono);font-size:11.5px;color:rgba(245,240,232,0.5);margin-bottom:12px}
.producer-tagline{font-family:var(--voice);font-style:italic;font-size:18px;color:var(--gold);margin:0 0 12px}
.producer-text{font-size:14px;line-height:1.7;color:rgba(245,240,232,0.62);max-width:68ch;margin:0 0 16px}
.pa-line{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--gold-dim);border:1px solid rgba(197,165,114,0.28);border-radius:2px;padding:5px 10px}
.site-link{display:block;margin-top:14px;font-family:var(--mono);font-size:11.5px}

/* ---- DNA band: burgundy wash, as the approved passport ------------------ */
.dna{background:linear-gradient(180deg,#2E0509,var(--bg) 78%)}
.dna-quote{font-family:var(--voice);font-style:italic;font-size:clamp(20px,4vw,26px);line-height:1.45;color:var(--gold);
  margin:0 0 24px;max-width:46ch}
.dna-grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:720px){.dna-grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
.dna-k{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:6px}
.dna-v{font-size:13.5px;line-height:1.65;color:rgba(245,240,232,0.68)}

/* ---- facts -------------------------------------------------------------- */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px}
.fact-k{font-family:var(--mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:6px}
.fact-v{font-family:var(--mono);font-size:14px;line-height:1.45;color:var(--cream)}

/* ---- vintages: cards, as the canon ------------------------------------- */
.vintages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.vintage{display:block;border:1px solid rgba(197,165,114,0.22);border-radius:2px;padding:20px 22px;transition:border-color .15s,background .15s}
.vintage:hover{border-color:rgba(197,165,114,0.5);background:rgba(197,165,114,0.05)}
.v-year{font-family:var(--serif);font-size:26px;color:var(--cream);margin-bottom:6px;line-height:1}
.v-meta{font-family:var(--mono);font-size:11px;color:rgba(245,240,232,0.45);margin-top:3px}
.v-empty{border:1px dashed rgba(197,165,114,0.28);border-radius:2px;padding:24px}
.v-empty-t{font-family:var(--serif);font-size:19px;margin-bottom:6px}
.v-empty-s{font-size:13px;color:rgba(245,240,232,0.5)}

/* ---- demo block (canon: "Coming soon") --------------------------------- */
.demo{position:relative;border:1px dashed rgba(197,165,114,0.3);border-radius:2px;padding:26px 28px;max-width:460px}
.demo-badge{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:9px;letter-spacing:0.16em;
  text-transform:uppercase;color:rgba(197,165,114,0.5)}
html[dir="rtl"] .demo-badge{right:auto;left:14px}
.demo-t{font-family:var(--serif);font-size:20px;margin-bottom:6px}
.demo-b{font-size:13px;color:rgba(245,240,232,0.55);margin-bottom:16px}
.demo-cta{display:inline-flex;padding:9px 16px;border:1px solid rgba(197,165,114,0.35);border-radius:2px;
  font-family:var(--mono);font-size:12px;color:rgba(197,165,114,0.75)}

/* ---- states ------------------------------------------------------------- */
.state{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:64px var(--pad);gap:14px}
.state-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.state-kick{font-family:var(--mono);font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:rgba(197,165,114,0.6)}
.state-title{font-family:var(--serif);font-weight:500;font-size:clamp(24px,5vw,31px);line-height:1.28;margin:0;max-width:22ch}
.state-body{font-size:14px;line-height:1.65;color:rgba(245,240,232,0.6);margin:0;max-width:44ch}
.state-note{font-size:12.5px;line-height:1.65;color:rgba(245,240,232,0.42);margin:0;max-width:46ch}
.btn{font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
  padding:10px 20px;border-radius:2px;border:1px solid rgba(197,165,114,0.4);background:transparent;color:var(--gold);cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold-soft)}

/* ---- footer ------------------------------------------------------------- */
.foot{padding:20px var(--pad);border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:10px;
  letter-spacing:0.08em;color:rgba(245,240,232,0.3)}
.fade-in{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

<script>
/* -----------------------------------------------------------------------------
 * The request contract is UNCHANGED: same endpoint, same parameters, same
 * permanent link (wine-passport.html?wineId=…&winerySlug=…). The producer band
 * reads the EXISTING public winery endpoint and is optional — if it fails, the
 * passport still renders in full.
 * --------------------------------------------------------------------------*/
const qs = new URLSearchParams(location.search);
const wineId = (qs.get('wineId') || '').trim();
let winerySlug = (qs.get('winerySlug') || qs.get('slug') || '').trim();
const lang = CAP.lang;
const lp = lang === 'en' ? '' : ('&lang=' + lang);
const t = CAP.t;
const API = qs.get('api') || (/^(localhost|127\.|0\.0)/.test(location.hostname) ? 'http://localhost:8088/api/cap' : 'https://tt-stack-prod.onrender.com/api/cap');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz = v => { const s = (v == null ? '' : String(v)).trim(); return s ? s : null; };
const wineryQs = () => winerySlug ? ('&winerySlug=' + encodeURIComponent(winerySlug)) : '';

/* The canon's bottle silhouette, inline so the plate never waits on a request. */
const BOTTLE_SVG = `<svg viewBox="0 0 120 360" role="img" aria-hidden="true"
  style="height:clamp(190px,42vw,330px);width:auto;opacity:0.85;">
  <!-- The canon's own Bordeaux silhouette, inlined verbatim from
       docs/design/canon/passport/assets/bottle-bordeaux-lg-transparent.svg
       (tt-mobile). Inlined rather than linked so the plate never waits on a
       request and the page stays one file. -->
  <path d="M43.2,0 L76.8,0 C76.8,39.6 78,67.32 78,79.2 C78,96.21 116.4,96.21 116.4,117 L116.4,345.6 C116.4,351.36 114,355.68 114,352.8 Q114,360 106.8,360 L13.2,360 Q6,360 6,352.8 C6,355.68 3.6,351.36 3.6,345.6 L3.6,117 C3.6,96.21 42,96.21 42,79.2 C42,67.32 43.2,39.6 43.2,0 Z"
        fill="none" stroke="#C5A572" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
  <path d="M42.74,30.6 L77.26,30.6" fill="none" stroke="#C5A572" stroke-width="1.6" stroke-linecap="round"></path>
  <rect x="24" y="183.3" width="72" height="96" fill="none" stroke="#C5A572" stroke-width="1.12" stroke-dasharray="4 2.4"></rect>
</svg>`;

function setCrumbs(parts) {
  document.getElementById('crumbs').innerHTML = parts.map((p, i) =>
    (i ? '<span class="crumb-sep">/</span>' : '') +
    (p.href ? `<a href="${p.href}">${esc(p.label)}</a>`
            : `<span class="${p.current ? 'crumb-current' : ''}">${esc(p.label)}</span>`)
  ).join('');
}

function enumLabel(prefix, raw) {
  const s = nz(raw); if (!s) return null;
  const key = prefix + '_' + s.toLowerCase();
  const out = t(key);
  return out === key ? s : out;
}



/* A date the way the approved passport prints one: month and year in the
   guest's language, never a raw database string. */
function fmtDate(raw) {
  const s = nz(raw); if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return s;
  try {
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return new Intl.DateTimeFormat(lang === 'ka' ? 'ka-GE' : lang, { month: 'short', year: 'numeric', timeZone: 'UTC' }).format(d);
  } catch (e) { return `${m[2]}.${m[1]}`; }
}

function vintageMeta(v) {
  const bits = [];
  if (v.bottles_produced != null && String(v.bottles_produced).trim() !== '') {
    bits.push(`${v.bottles_produced} ${t('bottles')}`);
  }
  const rel = fmtDate(v.release_date);
  if (rel) bits.push(`${t('wn_released')} ${rel}`);
  const abv = nz(v.abv);
  if (!bits.length && abv) bits.push(`${abv}% ABV`);
  return bits;
}

/* ---------- states -------------------------------------------------------- */
function stateScreen({ kick, title, body, note, button, icon }) {
  document.getElementById('app').innerHTML = `
    <div class="state fade-in">
      ${icon || ''}
      <div class="state-kick">${kick}</div>
      <h1 class="state-title">${title}</h1>
      ${body ? `<p class="state-body">${body}</p>` : ''}
      ${note ? `<p class="state-note">${note}</p>` : ''}
      ${button || ''}
    </div>`;
}
const dimIcon = `<div class="state-icon" style="border:1px solid rgba(197,165,114,0.35);background:rgba(197,165,114,0.05);">
  <span style="color:var(--gold-soft);font-family:var(--serif);font-size:26px;line-height:1;">…</span></div>`;

function renderLoading() {
  document.getElementById('app').innerHTML =
    `<div class="state"><div class="state-kick">${t('loading')}</div></div>`;
}
function renderNotFound() {
  document.getElementById('ctx-label').textContent = t('wn_ctx_loading');
  stateScreen({ kick: t('wn_nf_kick'), title: t('wn_nf_title'), body: t('wn_nf_body') });
}
function renderError() {
  stateScreen({ kick: t('wn_err_kick'), title: t('wn_err_title'), body: t('wn_err_body'),
    button: `<button class="btn" id="retry-btn">${t('wn_retry')}</button>` });
  document.getElementById('retry-btn').addEventListener('click', () => load());
}
/* The owner's screen: the passport exists, its address is permanent, the content
   is being updated. Never JSON, never an error, never "not found". */
function renderUnavailable() {
  document.getElementById('ctx-label').textContent = t('wn_ctx_loading');
  stateScreen({ icon: dimIcon, kick: t('wn_un_kick'), title: t('wn_un_title'),
    body: t('wn_un_body'), note: t('wn_un_note') });
}

/* ---------- the passport -------------------------------------------------- */
function renderPassport(w, vs) {
  document.getElementById('ctx-label').textContent = t('wn_ctx_ready');
  winerySlug = winerySlug || nz(w.winery_slug) || '';
  const wineryName = nz(w.winery_name);
  const wineryHref = winerySlug ? `winery-passport.html?slug=${encodeURIComponent(winerySlug)}${lp}` : null;

  setCrumbs([
    ...(wineryName ? [{ label: wineryName, href: wineryHref }] : []),
    { label: w.name, current: true },
  ]);

  const chips = [enumLabel('color', w.color), enumLabel('sweet', w.sweetness), nz(w.style)].filter(Boolean);
  const grapes = (w.grape_varieties || []).map(nz).filter(Boolean);
  const desc = nz(w.description);
  const story = nz(w.story_text);
  const hero = nz(w.hero_image_url);

  const vintagesInner = vs.length ? `
    <div class="vintages">${vs.map(v => {
      const meta = vintageMeta(v);
      return `<a class="vintage" href="vintage-passport.html?vintageId=${encodeURIComponent(v.id)}${wineryQs()}${lp}">
        <div class="v-year">${esc(v.vintage_year)}</div>
        ${meta.map(m => `<div class="v-meta">${esc(m)}</div>`).join('')}
      </a>`;
    }).join('')}</div>` : `
    <div class="v-empty">
      <div class="v-empty-t">${t('wn_vintages_empty')}</div>
      <div class="v-empty-s">${t('wn_vintages_empty_sub')}</div>
    </div>`;

  document.getElementById('app').innerHTML = `
    <article class="fade-in">
      <section class="hero">
        <div class="plate">${hero ? `<img src="${esc(hero)}" alt="${esc(w.name)}">` : BOTTLE_SVG}</div>
        <div class="identity">
          <div class="eyebrow eyebrow-strong" style="margin:0">${t('wn_kick')}</div>
          <h1 class="wine-name">${esc(w.name)}</h1>
          ${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}
          ${nz(w.appellation) ? `<div class="appellation">${esc(w.appellation)}</div>` : ''}
          ${grapes.length ? `<div class="grapes">${grapes.map(g => `<span class="grape">${esc(g)}</span>`).join('')}</div>` : ''}
          ${desc ? `<p class="desc">${esc(desc)}</p>` : ''}
          ${story ? `<blockquote class="story">${esc(story)}</blockquote>` : ''}
          ${wineryName ? `<div class="byline">${t('wn_by')} ${wineryHref ? `<a href="${wineryHref}">${esc(wineryName)} →</a>` : esc(wineryName)}</div>` : ''}
        </div>
      </section>



      <section class="band" id="producer-band" hidden></section>
      <section class="band dna" id="dna-band" hidden></section>

      <section class="band">
        <div class="eyebrow">${t('wn_vintages_label')}</div>
        ${vintagesInner}
      </section>

      <section class="band">
        <div class="eyebrow eyebrow-muted">${t('wn_coming_label')}</div>
        <div class="demo">
          <div class="demo-badge">${t('wn_demo_badge')}</div>
          <div class="demo-t">${t('wn_buy_title')}</div>
          <div class="demo-b">${t('wn_buy_body')}</div>
          <div class="demo-cta">${t('wn_shop_cta')}</div>
        </div>
      </section>
    </article>`;

  document.getElementById('foot').textContent = 'CAP · Tasting & Toasting';
  if (winerySlug) void loadProducer(winerySlug);
}

/* The producer, read from the EXISTING public winery endpoint. Optional by
   design: a failure here must never cost the guest the wine's passport. */
async function loadProducer(slug) {
  let data;
  try {
    const r = await fetch(`${API}/wineries/${encodeURIComponent(slug)}`);
    if (!r.ok) return;
    data = await r.json();
  } catch (e) { return; }
  const wy = data && data.winery; if (!wy) return;

  const place = [nz(wy.locality), nz(wy.region)].filter(Boolean).join(', ');
  const placeLine = [place, nz(wy.country)].filter(Boolean).join(' · ');
  const founded = (wy.founded_year != null && String(wy.founded_year).trim() !== '')
    ? `${t('founded')} ${wy.founded_year}` : null;
  const band = document.getElementById('producer-band');
  band.innerHTML = `
    <div class="eyebrow">${t('wn_producer_label')}</div>
    <div class="producer-name">${esc(wy.name)}</div>
    ${placeLine || founded ? `<div class="producer-place">${esc([placeLine, founded].filter(Boolean).join(' · '))}</div>` : ''}
    ${nz(wy.tagline) ? `<p class="producer-tagline">${esc(wy.tagline)}</p>` : ''}
    ${nz(wy.description) ? `<p class="producer-text">${esc(wy.description)}</p>` : ''}
    <span class="pa-line">${t('pa_label')}</span>
    ${nz(wy.website_url) ? `<a class="site-link" href="${esc(wy.website_url)}" target="_blank" rel="noopener">${esc(wy.website_url)}</a>` : ''}`;
  band.hidden = false;

  const dna = data.dna;
  if (!dna) return;
  const cells = [
    [t('family'), nz(dna.family_story)],
    [t('land'), nz(dna.land_story)],
    [t('philosophy'), nz(dna.philosophy)],
    [t('story'), nz(dna.founding_story)],
  ].filter(([, v]) => !!v);
  const quote = nz(dna.signature_quote);
  if (!cells.length && !quote) return;
  const dnaBand = document.getElementById('dna-band');
  dnaBand.innerHTML = `
    <div class="eyebrow">${t('dna_title')}</div>
    ${quote ? `<blockquote class="dna-quote">${esc(quote)}</blockquote>` : ''}
    ${cells.length ? `<div class="dna-grid">${cells.map(([k, v]) => `
      <div><div class="dna-k">${esc(k)}</div><div class="dna-v">${esc(v)}</div></div>`).join('')}</div>` : ''}`;
  dnaBand.hidden = false;
}

async function load() {
  if (!wineId) { renderNotFound(); return; }
  renderLoading();
  let data;
  try {
    const r = await fetch(`${API}/wines/${encodeURIComponent(wineId)}`);
    if (r.status === 404 || r.status === 400) { renderNotFound(); return; }
    if (!r.ok) { renderError(); return; }
    data = await r.json();
  } catch (e) { renderError(); return; }
  if (data && data.availability === 'temporarily_unavailable') { renderUnavailable(); return; }
  if (!data || !data.wine) { renderNotFound(); return; }
  renderPassport(data.wine, data.vintages || []);
}

CAP.wireSwitcher();
CAP.applyStatic();
load();
</script>
