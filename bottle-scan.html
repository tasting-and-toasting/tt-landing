<style>
/* -----------------------------------------------------------------------------
 * Only what belongs to the BOTTLE and to no other passport. Everything shared
 * lives in src/cap/passport-canon.css and is NOT re-declared here: no colours,
 * no typefaces, no bands, no states.
 *
 * The edition number, the scanned token, the lifecycle chip, the scan counter
 * and the provenance timeline are bottle-only by the owner's ruling — they must
 * never appear on the wine, winery or vintage passport.
 * --------------------------------------------------------------------------*/

/* Hero plate. Here the silhouette is the SUBJECT, not a placeholder: the scan
   payload carries no bottle photograph (tt-stack api/src/routes/cap.ts,
   GET /api/cap/scan/:qrToken), so it gets the canon's own size — 210 / 280 /
   340 by viewport, as the approved passport (tt-mobile app/v2/cap/bottle.tsx,
   useMetrics.bottleHeight). */
.plate-bottle{flex-direction:column;gap:24px;padding:40px var(--pad)}
@media(min-width:600px){.plate-bottle{padding:56px var(--pad)}}
.plate-bottle svg{height:210px;width:auto}
@media(min-width:600px){.plate-bottle svg{height:280px}}
@media(min-width:900px){.plate-bottle svg{height:340px}}
.plate-caption{text-align:center}
.edition{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;color:var(--gold)}
@media(min-width:760px){.edition{font-size:38px}}
.qr-token{font-family:var(--mono);font-size:11px;letter-spacing:0.04em;color:rgba(245,240,232,0.45);
  margin-top:8px;word-break:break-all}
.hero-status{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
.status-chip{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;
  padding:4px 10px;border:1px solid rgba(197,165,114,0.4);border-radius:2px;color:var(--gold)}
.scans{font-family:var(--mono);font-size:10px;color:rgba(245,240,232,0.4)}
.h1-year{color:var(--gold)}

/* Provenance timeline — the bottle's own journey. */
.timeline{position:relative;max-width:720px;padding-left:24px;border-left:1px solid rgba(197,165,114,0.3)}
html[dir="rtl"] .timeline{padding-left:0;padding-right:24px;border-left:0;border-right:1px solid rgba(197,165,114,0.3)}
.tl-item{position:relative;padding-bottom:30px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-29px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
html[dir="rtl"] .tl-dot{left:auto;right:-29px}
.tl-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.tl-event{font-family:var(--serif);font-size:17px;color:var(--cream)}
.tl-when{font-family:var(--mono);font-size:11px;color:rgba(245,240,232,0.45)}
.tl-desc{font-size:13px;line-height:1.6;color:rgba(245,240,232,0.6);margin:6px 0 0;max-width:62ch}

/* Two demo cards side by side — the canon's minmax(320px,1fr). */
.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.demo-grid .demo{max-width:none}

/* The withdrawn code keeps its silhouette, dimmed. */
.void-mark{opacity:0.4;margin-bottom:6px}
.void-mark svg{height:clamp(140px,28vw,220px);width:auto}
</style>
</head>

<script>
/* -----------------------------------------------------------------------------
 * CAP-PASSPORT-FAMILY-CANON-01 — the bottle passport in the approved design
 * system. The REQUEST CONTRACT IS UNCHANGED: same endpoint
 * (GET {API}/scan/{token}), same single parameter (?token=), same permanent
 * public link (bottle-scan.html?token=…).
 *
 * Every value below comes from a field the server really sends — verified in
 * tt-stack api/src/routes/cap.ts, the reply of GET /api/cap/scan/:qrToken
 * (bottle, wine, vintage, winery, dna, timeline). Nothing is synthesized and an
 * empty field hides its row rather than printing a placeholder.
 *
 * ONE TRUST CLAIM. `verification_status`, `ownership_confirmed` and
 * `ownership_badge` are deliberately NOT rendered — the server hard-codes the
 * badge text and this document must never claim a verification we have not
 * performed. The page says exactly one thing about the nature of its data:
 * the localized "Producer-asserted" (pa_label), which is the canon's own rule
 * (docs/design/canon/passport/README.md) and the behaviour of the approved
 * passport in the app (tt-mobile app/v2/cap/bottle.tsx).
 * --------------------------------------------------------------------------*/
const qs = new URLSearchParams(location.search);
const token = (qs.get('token') || '').trim();
const lang = CAP.lang;
const t = CAP.t;
const API = qs.get('api') || (/^(localhost|127\.|0\.0)/.test(location.hostname) ? 'http://localhost:8088/api/cap' : 'https://tt-stack-prod.onrender.com/api/cap');
/* Carried into every cross-link so language and API target survive the walk
   between the four passports. */
const lp = lang === 'en' ? '' : ('&lang=' + lang);
const ap = qs.get('api') ? ('&api=' + encodeURIComponent(qs.get('api'))) : '';
const keep = lp + ap;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz = v => { const s = (v == null ? '' : String(v)).trim(); return s ? s : null; };

/* The canon's Bordeaux silhouette, inlined verbatim from
   docs/design/canon/passport/assets/bottle-bordeaux-lg-transparent.svg
   (tt-mobile), the same mark the approved passport draws (BottleMark). Inlined
   so the plate never waits on a request and the page stays one file. */
const BOTTLE_SVG = `<svg viewBox="0 0 120 360" role="img" aria-hidden="true">
  <path d="M43.2,0 L76.8,0 C76.8,39.6 78,67.32 78,79.2 C78,96.21 116.4,96.21 116.4,117 L116.4,345.6 C116.4,351.36 114,355.68 114,352.8 Q114,360 106.8,360 L13.2,360 Q6,360 6,352.8 C6,355.68 3.6,351.36 3.6,345.6 L3.6,117 C3.6,96.21 42,96.21 42,79.2 C42,67.32 43.2,39.6 43.2,0 Z"
        fill="none" stroke="#C5A572" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
  <path d="M42.74,30.6 L77.26,30.6" fill="none" stroke="#C5A572" stroke-width="1.6" stroke-linecap="round"></path>
  <rect x="24" y="183.3" width="72" height="96" fill="none" stroke="#C5A572" stroke-width="1.12" stroke-dasharray="4 2.4"></rect>
</svg>`;

function setCrumbs(parts) {
  document.getElementById('crumbs').innerHTML = parts.map((p, i) =>
    (i ? '<span class="crumb-sep">/</span>' : '') +
    (p.href ? `<a href="${p.href}">${esc(p.label)}</a>`
            : `<span class="${p.current ? 'crumb-current' : ''}">${esc(p.label)}</span>`)
  ).join('');
}

/* A dictionary value, or null when the enum is not one we publish. An unknown
   colour or sweetness is shown verbatim; an unknown lifecycle is dropped. */
const COLORS = ['red', 'white', 'rose', 'orange', 'sparkling'];
const SWEET = ['dry', 'semi_dry', 'semi_sweet', 'sweet'];
const STATUSES = ['minted', 'claimed', 'active', 'activated', 'void'];
function enumLabel(prefix, raw) {
  const s = nz(raw); if (!s) return null;
  const out = t(prefix + '_' + s.toLowerCase());
  return out === prefix + '_' + s.toLowerCase() ? s : out;
}
function statusLabel(raw) {
  const s = nz(raw); if (!s) return null;
  const k = s.toLowerCase();
  return STATUSES.indexOf(k) === -1 ? null : t('bp_st_' + k);
}
/* An event we do not publish a name for is humanized, never blanked. */
const EVENTS = ['harvest', 'fermentation', 'ageing', 'bottling', 'release'];
function eventLabel(raw) {
  const s = nz(raw); if (!s) return '';
  return EVENTS.indexOf(s) === -1 ? s.replace(/_/g, ' ') : t('ev_' + s);
}

/* Month and year in the guest's language, never a raw database string. The
   DATE columns serialize as full ISO timestamps, so only the date part is read. */
function fmtDate(raw) {
  const s = nz(raw); if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return s;
  try {
    const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return new Intl.DateTimeFormat(lang === 'ka' ? 'ka-GE' : lang, { month: 'short', year: 'numeric', timeZone: 'UTC' }).format(d);
  } catch (e) { return `${m[2]}.${m[1]}`; }
}
/* `abv` arrives as a numeric string; `grape_composition` as a JSONB object. */
function fmtAbv(raw) {
  const s = nz(raw); if (!s) return null;
  const n = Number(s);
  return isNaN(n) ? s : String(n);
}
function fmtComposition(gc) {
  if (!gc) return null;
  if (typeof gc === 'string') return nz(gc);
  if (Array.isArray(gc)) {
    const parts = gc.map(g => g && nz(g.name) ? (nz(g.name) + (g.pct != null ? ' ' + g.pct + '%' : '')) : null).filter(Boolean);
    return parts.length ? parts.join(' · ') : null;
  }
  if (typeof gc === 'object') {
    const parts = Object.keys(gc).map(k => nz(k) ? (k + ' ' + gc[k] + '%') : null).filter(Boolean);
    return parts.length ? parts.join(' · ') : null;
  }
  return null;
}

function vintageFacts(v) {
  const out = [];
  const abv = fmtAbv(v.abv);
  if (abv) out.push([t('abv'), abv + '%']);
  const comp = fmtComposition(v.grape_composition);
  if (comp) out.push([t('bp_fact_composition'), comp]);
  if (v.bottles_produced != null && String(v.bottles_produced).trim() !== '') {
    out.push([t('total_bottles'), String(v.bottles_produced)]);
  }
  const rel = fmtDate(v.release_date);
  if (rel) out.push([t('wn_released'), rel]);
  return out;
}

/* ---------- states -------------------------------------------------------- */
function stateScreen({ mark, kick, title, body, actions }) {
  document.getElementById('ctx-label').textContent = t('bp_ctx_loading');
  document.getElementById('app').innerHTML = `
    <div class="state fade-in">
      ${mark || ''}
      <div class="state-kick">${kick}</div>
      <h1 class="state-title">${title}</h1>
      ${body ? `<p class="state-body">${body}</p>` : ''}
      ${actions || ''}
    </div>`;
  document.getElementById('foot').textContent = 'CAP · Tasting & Toasting';
}
const exploreLink = `<a class="xlink" href="https://tastingandtoasting.com">${t('wp_explore')}</a>`;

function renderLoading() {
  document.getElementById('ctx-label').textContent = t('bp_ctx_loading');
  document.getElementById('app').innerHTML =
    `<div class="state"><div class="state-kick">${t('loading')}</div></div>`;
}
function renderNotFound() {
  stateScreen({ kick: t('bp_nf_kick'), title: t('bp_nf_title'), body: t('bp_nf_body'),
    actions: `<div class="links">${exploreLink}</div>` });
}
function renderError() {
  stateScreen({ kick: t('bp_err_kick'), title: t('bp_err_title'), body: t('bp_err_body'),
    actions: `<div class="links"><button class="btn" id="retry-btn">${t('bp_retry')}</button></div>` });
  document.getElementById('retry-btn').addEventListener('click', () => load());
}
/* A code the producer has withdrawn (`cap_bottles.status = 'void'`). Its own
   screen and NO passport: the record is real, but rendering the document would
   keep repeating a claim the producer has taken back. It is not the not-found
   screen either — that one is an unknown code. */
function renderRevoked() {
  stateScreen({ mark: `<div class="void-mark">${BOTTLE_SVG}</div>`,
    kick: t('bp_vd_kick'), title: t('bp_vd_title'), body: t('bp_vd_body') });
}

/* ---------- the passport -------------------------------------------------- */
function renderPassport(d) {
  document.getElementById('ctx-label').textContent = t('bp_ctx_ready');
  const w = d.winery || {}, wine = d.wine || {}, v = d.vintage || {}, b = d.bottle || {};
  const dna = d.dna, tl = d.timeline || [];
  const slug = nz(w.slug);

  const wineryHref = slug ? `winery-passport.html?slug=${encodeURIComponent(slug)}${keep}` : null;
  const wineHref = nz(wine.id)
    ? `wine-passport.html?wineId=${encodeURIComponent(wine.id)}${slug ? '&winerySlug=' + encodeURIComponent(slug) : ''}${keep}`
    : null;
  const vintageHref = nz(v.id)
    ? `vintage-passport.html?vintageId=${encodeURIComponent(v.id)}${slug ? '&winerySlug=' + encodeURIComponent(slug) : ''}${keep}`
    : null;

  const crumbs = [];
  if (nz(w.name)) crumbs.push({ label: w.name, href: wineryHref });
  if (nz(wine.name)) crumbs.push({ label: wine.name, href: wineHref });
  if (v.vintage_year != null) crumbs.push({ label: String(v.vintage_year), href: vintageHref });
  if (b.bottle_number != null) crumbs.push({ label: t('bp_crumb_bottle').replace('{n}', String(b.bottle_number)), current: true });
  setCrumbs(crumbs);

  /* --- hero: the plate's own metadata (bottle-only) --- */
  const edition = (b.bottle_number != null && b.total_in_series != null)
    ? `<div class="edition">No. ${esc(b.bottle_number)} / ${esc(b.total_in_series)}</div>` : '';
  const qrToken = nz(b.qr_token);
  const statusChip = statusLabel(b.status);
  /* The handler reads scan_count BEFORE bumping it, so this is "scans before
     this one". Hidden at zero rather than telling a first visitor "0 scans". */
  const scans = (typeof b.scan_count === 'number' && isFinite(b.scan_count) && b.scan_count > 0)
    ? t('bp_scans_n').replace('{n}', String(b.scan_count)) : null;

  const chips = [enumLabel('color', wine.color), enumLabel('sweet', wine.sweetness), nz(wine.style)].filter(Boolean);
  const grapes = (wine.grape_varieties || []).map(nz).filter(Boolean);
  const desc = nz(wine.description);
  const story = nz(wine.story_text);

  /* --- vintage band --- */
  const facts = vintageFacts(v);
  const prodNotes = nz(v.production_notes);
  const tasteNotes = nz(v.tasting_notes);
  const vintageBand = (facts.length || prodNotes || tasteNotes) ? `
    <section class="band">
      <div class="eyebrow">${t('bp_sec_vintage')}${v.vintage_year != null ? ' ' + esc(v.vintage_year) : ''}</div>
      ${facts.length ? `<div class="facts">${facts.map(([k, val]) => `
        <div><div class="fact-k">${esc(k)}</div><div class="fact-v">${esc(val)}</div></div>`).join('')}</div>` : ''}
      ${prodNotes ? `<p class="prose">${esc(prodNotes)}</p>` : ''}
      ${tasteNotes ? `<blockquote class="prose-quote">${esc(tasteNotes)}</blockquote>` : ''}
    </section>` : '';

  /* --- winery band --- */
  const place = [nz(w.locality), nz(w.region)].filter(Boolean).join(', ');
  const placeLine = [place, nz(w.country)].filter(Boolean).join(' · ');
  const founded = (w.founded_year != null && String(w.founded_year).trim() !== '')
    ? `${t('founded')} ${w.founded_year}` : null;
  const metaLine = [placeLine, founded].filter(Boolean).join(' · ');
  const wineryBand = nz(w.name) ? `
    <section class="band">
      <div class="eyebrow">${t('winery_section')}</div>
      <div class="producer-name">${esc(w.name)}</div>
      ${metaLine ? `<div class="producer-place">${esc(metaLine)}</div>` : ''}
      ${nz(w.tagline) ? `<p class="producer-tagline">${esc(w.tagline)}</p>` : ''}
      ${nz(w.description) ? `<p class="producer-text">${esc(w.description)}</p>` : ''}
      <span class="pa-line">${t('pa_label')}</span>
      ${nz(w.website_url) ? `<a class="site-link" href="${esc(w.website_url)}" target="_blank" rel="noopener">${esc(w.website_url)}</a>` : ''}
    </section>` : '';

  /* --- DNA band --- */
  const cells = dna ? [
    [t('family'), nz(dna.family)],
    [t('land'), nz(dna.land_story)],
    [t('philosophy'), nz(dna.philosophy)],
    [t('story'), nz(dna.founding_story)],
  ].filter(([, val]) => !!val) : [];
  const dnaQuote = dna ? nz(dna.signature_quote) : null;
  const dnaBand = (cells.length || dnaQuote) ? `
    <section class="band dna">
      <div class="eyebrow">${t('dna_title')}</div>
      ${dnaQuote ? `<blockquote class="dna-quote">${esc(dnaQuote)}</blockquote>` : ''}
      ${cells.length ? `<div class="dna-grid">${cells.map(([k, val]) => `
        <div><div class="dna-k">${esc(k)}</div><div class="dna-v">${esc(val)}</div></div>`).join('')}</div>` : ''}
    </section>` : '';

  /* --- provenance timeline (bottle-only) --- */
  const timelineInner = tl.length ? `
    <div class="timeline">${tl.map(e => {
      const when = fmtDate(e.occurred_at);
      return `<div class="tl-item"><span class="tl-dot" aria-hidden="true"></span>
        <div class="tl-head"><span class="tl-event">${esc(eventLabel(e.event_type))}</span>
        ${when ? `<span class="tl-when">${esc(when)}</span>` : ''}</div>
        ${nz(e.description) ? `<p class="tl-desc">${esc(e.description)}</p>` : ''}
      </div>`;
    }).join('')}</div>` : `
    <div class="v-empty">
      <div class="v-empty-t">${t('bp_timeline_empty')}</div>
      <div class="v-empty-s">${t('bp_timeline_empty_sub')}</div>
    </div>`;

  /* --- walk the chain --- */
  const xlinks = [
    vintageHref ? `<a class="xlink" href="${vintageHref}">${t('bp_link_vintage')} →</a>` : '',
    wineHref ? `<a class="xlink" href="${wineHref}">${t('back_wine')} →</a>` : '',
    wineryHref ? `<a class="xlink" href="${wineryHref}">${t('back_winery')} →</a>` : '',
  ].filter(Boolean).join('');

  document.getElementById('app').innerHTML = `
    <article class="fade-in">
      <section class="hero">
        <div class="plate plate-bottle">
          ${BOTTLE_SVG}
          ${edition || qrToken || statusChip || scans ? `<div class="plate-caption">
            ${edition}
            ${qrToken ? `<div class="qr-token">${esc(qrToken)}</div>` : ''}
            ${statusChip || scans ? `<div class="hero-status">
              ${statusChip ? `<span class="status-chip">${esc(statusChip)}</span>` : ''}
              ${scans ? `<span class="scans">${esc(scans)}</span>` : ''}
            </div>` : ''}
          </div>` : ''}
        </div>
        <div class="identity">
          <div class="eyebrow eyebrow-strong" style="margin:0">${t('wn_kick')}</div>
          <h1 class="wine-name">${esc(wine.name)}${v.vintage_year != null ? ` <span class="h1-year">${esc(v.vintage_year)}</span>` : ''}</h1>
          ${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''}
          ${nz(wine.appellation) ? `<div class="appellation">${esc(wine.appellation)}</div>` : ''}
          ${grapes.length ? `<div class="grapes">${grapes.map(g => `<span class="grape">${esc(g)}</span>`).join('')}</div>` : ''}
          ${desc ? `<p class="desc">${esc(desc)}</p>` : ''}
          ${story ? `<blockquote class="story">${esc(story)}</blockquote>` : ''}
          ${nz(w.name) ? `<div class="byline">${t('wn_by')} ${wineryHref ? `<a href="${wineryHref}">${esc(w.name)} →</a>` : esc(w.name)}</div>` : ''}
        </div>
      </section>

      ${vintageBand}
      ${wineryBand}
      ${dnaBand}

      <section class="band">
        <div class="eyebrow">${t('bp_timeline_label')}</div>
        ${timelineInner}
      </section>

      ${xlinks ? `<section class="band"><div class="links">${xlinks}</div></section>` : ''}

      <section class="band">
        <div class="eyebrow eyebrow-muted">${t('wn_coming_label')}</div>
        <div class="demo-grid">
          <div class="demo">
            <div class="demo-badge">${t('wn_demo_badge')}</div>
            <div class="demo-t">${t('bp_buy_title')}</div>
            <div class="demo-b">${t('wn_buy_body')}</div>
            <div class="demo-cta">${t('wn_shop_cta')}</div>
          </div>
          <div class="demo">
            <div class="demo-badge">${t('wn_demo_badge')}</div>
            <div class="demo-t">${t('bp_tasting_title')}</div>
            <div class="demo-b">${t('bp_tasting_body')}</div>
            <div class="demo-cta">${t('bp_tasting_cta')}</div>
          </div>
        </div>
      </section>
    </article>`;

  document.getElementById('foot').textContent = 'CAP · Tasting & Toasting';
}

async function load() {
  if (!token) { renderNotFound(); return; }
  renderLoading();
  let d;
  try {
    const r = await fetch(`${API}/scan/${encodeURIComponent(token)}`);
    if (r.status === 404 || r.status === 400) { renderNotFound(); return; }
    if (!r.ok) { renderError(); return; }
    d = await r.json();
  } catch (e) { renderError(); return; }
  if (!d || !d.bottle || !d.wine) { renderNotFound(); return; }
  /* The ONE status gate. Every other live status ('minted' | 'claimed' |
     'active' | 'activated') is a real bottle and gets the full document. */
  if (nz(d.bottle.status) && String(d.bottle.status).toLowerCase() === 'void') { renderRevoked(); return; }
  renderPassport(d);
}

CAP.wireSwitcher();
CAP.applyStatic();
load();
</script>
</body>
</html>
