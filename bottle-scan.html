<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Bottle passport · Tasting &amp; Toasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%}
  body{background:#1A0B08;color:#F5F0E8;font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:#C5A572;text-decoration:none}
  a:hover{color:#F5F0E8}
  img,svg{max-width:100%}
  button{font:inherit;color:inherit}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:20px 48px;border-bottom:1px solid rgba(197,165,114,0.16);flex-wrap:wrap}
  .brand{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:0.02em;color:#C5A572;flex:0 0 auto}
  .crumbs{display:flex;align-items:center;gap:8px;flex:1 1 200px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.02em;color:rgba(245,240,232,0.5);min-width:0}
  .crumbs a{color:rgba(245,240,232,0.5)}
  .crumbs a:hover{color:#F5F0E8}
  .crumbs .now{color:#C5A572}
  .sep{color:rgba(197,165,114,0.4)}
  .lang-switcher-flags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;max-width:100%}
  .lang-flag-link{display:inline-flex;align-items:center;justify-content:center;width:30px;height:20px;border-radius:3px;overflow:hidden;border:1px solid rgba(197,165,114,0.14);opacity:.78}
  .lang-flag-link:hover{opacity:1;color:inherit}
  .lang-flag-link.is-current-lang{opacity:1;border-color:#C5A572;box-shadow:0 0 0 1px rgba(197,165,114,0.35)}
  .lang-flag-link svg{width:100%;height:100%;display:block}
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));border-bottom:1px solid rgba(197,165,114,0.16)}
  .plate{background:radial-gradient(ellipse at center, rgba(43,24,16,0.9), #0F0507 75%);padding:56px 48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-width:0}
  .identity{padding:56px 48px;display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
  .photo-col{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:460px}
  .photo-frame{position:relative;width:100%;height:340px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(197,165,114,0.16);border-radius:2px;background:rgba(197,165,114,0.03);padding:12px;cursor:zoom-in}
  .photo-frame img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
  .zoom-cue{position:absolute;right:10px;bottom:10px;padding:4px 10px;border:1px solid rgba(197,165,114,0.45);border-radius:2px;background:rgba(15,5,7,0.78);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#C5A572;opacity:0;pointer-events:none;transition:opacity .15s}
  .photo-frame:hover .zoom-cue{opacity:1}
  .credit{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:16px;color:rgba(245,240,232,0.62);text-align:center;overflow-wrap:anywhere}
  .thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .thumb{width:54px;height:54px;padding:4px;border:1px solid rgba(197,165,114,0.22);border-radius:2px;background:rgba(197,165,114,0.04);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .thumb.is-on{border-color:#C5A572}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain}
  .photo-pos{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(245,240,232,0.4)}
  .sil{height:340px;width:auto;display:block}
  .edition{font-family:'Fraunces',serif;font-weight:500;font-size:38px;color:#C5A572;text-align:center;overflow-wrap:anywhere}
  .token{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(245,240,232,0.45);margin-top:8px;text-align:center;overflow-wrap:anywhere}
  .status-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .chip{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(197,165,114,0.4);border-radius:2px;color:#C5A572}
  .scans{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(245,240,232,0.4);align-self:center}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#8B7548}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:42px;line-height:1.05;margin:0;overflow-wrap:anywhere}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .softchip{font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(197,165,114,0.3);border-radius:2px;color:rgba(245,240,232,0.7)}

  .grapes{display:flex;gap:6px;flex-wrap:wrap}
  .grapes span{font-size:11px;color:#C5A572}
  .prose{font-size:15px;line-height:1.6;color:rgba(245,240,232,0.75);margin:6px 0 0}
  .quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;line-height:1.5;color:#C5A572;margin:8px 0 0;padding-left:20px;border-left:2px solid rgba(197,165,114,0.4)}
  .byline{margin-top:10px;font-size:13px;color:rgba(245,240,232,0.55)}
  .byline:hover{color:#F5F0E8}
  .band{padding:64px 48px;border-bottom:1px solid rgba(197,165,114,0.12)}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:24px}
  .fact-k{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(245,240,232,0.4);margin-bottom:6px}
  .fact-v{font-family:'JetBrains Mono',monospace;font-size:16px;overflow-wrap:anywhere}
  .notes{font-size:14px;line-height:1.6;color:rgba(245,240,232,0.65);margin:28px 0 0;max-width:640px}
  .tasting{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.55;color:#C5A572;margin:20px 0 0;max-width:640px}
  .winery-name{font-family:'Fraunces',serif;font-size:28px;margin:0 0 8px;overflow-wrap:anywhere}
  .place{display:flex;gap:10px;align-items:center;font-size:13px;color:rgba(245,240,232,0.6);margin-bottom:4px;flex-wrap:wrap}
  .flag{width:16px;height:11px;display:block;border:1px solid rgba(197,165,114,0.35);flex:0 0 auto}
  .founded{font-size:12px;color:rgba(245,240,232,0.4);margin-bottom:16px}
  .tagline{font-family:'Fraunces',serif;font-style:italic;font-size:18px;color:#C5A572;margin:0 0 14px}
  .winery-body{font-size:14px;line-height:1.6;color:rgba(245,240,232,0.7);max-width:640px;margin:0 0 20px}
  .badge-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .website{font-size:13px;color:rgba(245,240,232,0.55);overflow-wrap:anywhere}
  .website:hover{color:#F5F0E8}
  .dna{padding:72px 48px;background:linear-gradient(180deg, #2E0509 0%, #1A0B08 100%);border-bottom:1px solid rgba(197,165,114,0.12)}

  .dna-v{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;line-height:1.5;color:#F5F0E8}

  .first-line{font-size:13px;color:rgba(245,240,232,0.7);margin:0 0 22px}
  .tl{position:relative;max-width:720px;padding-left:24px;border-left:1px solid rgba(197,165,114,0.3)}
  .tl-item{position:relative;padding-bottom:32px}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-29px;top:4px;width:9px;height:9px;border-radius:50%;background:#C5A572}

  .tl-label{font-family:'Fraunces',serif;font-size:17px;color:#F5F0E8}
  .tl-when{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(245,240,232,0.45)}
  .tl-desc{font-size:13px;color:rgba(245,240,232,0.6);margin-top:6px}
  .links{padding:40px 48px;border-bottom:1px solid rgba(197,165,114,0.12);display:flex;gap:12px;flex-wrap:wrap}
  .navbtn{padding:12px 22px;border:1px solid rgba(197,165,114,0.4);border-radius:2px;font-size:13px;color:#C5A572;background:transparent;cursor:pointer;font-family:'Inter',system-ui,sans-serif}
  .navbtn:hover{color:#F5F0E8}
  .state{min-height:64vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px;gap:18px}
  .state-eye{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:rgba(197,165,114,0.6)}
  .state h1{font-family:'Fraunces',serif;font-weight:500;font-size:32px;max-width:520px;line-height:1.3}
  .state p{font-size:14px;color:rgba(245,240,232,0.55);max-width:440px;margin:0}
  .skel{background:rgba(197,165,114,0.08);border-radius:2px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
  .lb{position:fixed;inset:0;z-index:80;background:rgba(15,5,7,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:56px 16px 28px}
  .lb[hidden]{display:none !important}
  .lb img{max-width:min(92vw,900px);max-height:78vh;object-fit:contain;width:auto;height:auto}
  .lb-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border:1px solid rgba(197,165,114,0.45);border-radius:2px;background:transparent;color:#C5A572;font-size:22px;line-height:1;cursor:pointer}
  .lb-credit{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(245,240,232,0.75);text-align:center;max-width:640px;overflow-wrap:anywhere}
  html[dir="rtl"] .topbar,html[dir="rtl"] .crumbs,html[dir="rtl"] .lang-switcher-flags,html[dir="rtl"] .status-row,html[dir="rtl"] .links,html[dir="rtl"] .badge-row,html[dir="rtl"] .place{flex-direction:row-reverse}
  html[dir="rtl"] .quote{border-left:none;border-right:2px solid rgba(197,165,114,0.4);padding-left:0;padding-right:20px}
  html[dir="rtl"] .tl{padding-left:0;padding-right:24px;border-left:none;border-right:1px solid rgba(197,165,114,0.3)}
  html[dir="rtl"] .tl-dot{left:auto;right:-29px}
  html[dir="rtl"] .lb-x{right:auto;left:14px}
  html[dir="rtl"] .zoom-cue{right:auto;left:10px}
  @media (min-width:860px){
    .plate{border-right:1px solid rgba(197,165,114,0.16)}
  }
  @media (max-width:859px){
    .plate{border-bottom:1px solid rgba(197,165,114,0.16)}
  }
  @media (max-width:760px){
    .topbar{padding:14px 16px}
    .plate,.identity{padding:32px 16px}
    .band,.links{padding:40px 16px}
    .dna{padding:48px 16px}
    .state{padding:48px 16px}
    h1{font-size:32px}
    .edition{font-size:30px}
    .winery-name{font-size:24px}
    .photo-frame,.sil{height:280px}
  }
</style>
</head>

<script>
const qs = new URLSearchParams(location.search);
const token = (qs.get('token') || '').trim();
const lang = CAP.lang;
const t = CAP.t;
const API = qs.get('api') || (/^(localhost|127\.|0\.0)/.test(location.hostname) ? 'http://localhost:8088/api/cap' : 'https://tt-stack-prod.onrender.com/api/cap');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function enumLabel(prefix, known, raw){
  const s = nonEmpty(raw); if (!s) return null;
  const norm = s.toLowerCase();
  if (!known.has(norm)) return s;
  const label = t(prefix + '_' + norm);
  return label && label !== prefix + '_' + norm ? label : s;
}
function eventLabel(type){
  const s = nonEmpty(type); if (!s) return '';
  const key = s.toLowerCase();
  if (EVENTS.has(key)){ const label = t('ev_' + key); return label && label !== 'ev_' + key ? label : s; }
  return s.replace(/_/g, ' ');
}
function bottleStatusLabel(status){
  const s = nonEmpty(status); if (!s) return null;
  const key = s.toLowerCase();
  if (!BOTTLE_STATUS.has(key)) return null;
  return ui('bs_' + key);
}

function formatDate(raw){
  const s = nonEmpty(raw); if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return s;
  const months = ui('months');
  const idx = Number(m[2]) - 1;
  const month = months && months[idx];
  if (!month) return m[1] + '-' + m[2] + '-' + m[3];
  return Number(m[3]) + ' ' + month + ' ' + m[1];
}

/* EMPTY GATE (abv): a missing strength must not render as a bare "%". */
function abvFact(v){
  if (v == null || String(v).trim() === '') return null;
  const n = Number(String(v).trim());
  if (!Number.isFinite(n)) return null;
  return String(n) + '%';
}

function compositionShare(value){
  const s = String(value).trim();
  if (!s) return '';
  if (s.endsWith('%')) return s;
  return Number.isFinite(Number(s)) ? s + '%' : s;
}
function formatComposition(v){
  if (v == null) return null;
  if (typeof v === 'string') return nonEmpty(v);
  if (Array.isArray(v)){
    const parts = v.filter(x => typeof x === 'string' || typeof x === 'number').map(x => String(x).trim()).filter(Boolean);
    return parts.length ? parts.join(', ') : null;
  }
  if (typeof v === 'object'){
    const parts = Object.entries(v).filter(([k, val]) => String(k).trim() && (typeof val === 'string' || typeof val === 'number')).map(([k, val]) => (String(k).trim() + ' ' + compositionShare(val)).trim());
    return parts.length ? parts.join(', ') : null;
  }
  return null;
}

const PHOTO_CREDITS = [
  { host:'bdxfamilies.fr', name:'BDX Families' },
  { host:'bordeauxfamilies.fr', name:'BDX Families' },
  { host:'pfaffenheim.com', name:'Cave de Pfaffenheim' }
];
function photoHost(url){
  const m = /^https?:\/\/([^/?#]+)/i.exec(String(url == null ? '' : url).trim());
  if (!m) return null;
  const host = (m[1].split('@').pop() || '').split(':')[0].trim().toLowerCase();
  const bare = host.replace(/^www\./, '');
  return bare.length > 0 && bare.indexOf('.') !== -1 ? bare : null;
}
function photoCredit(url){
  const host = photoHost(url);
  if (!host) return null;
  const named = PHOTO_CREDITS.find(c => host === c.host || host.endsWith('.' + c.host));
  return named ? { kind:'producer', name:named.name } : { kind:'domain', domain:host };
}
function bottlePhotoList(d){
  const out = []; const seen = new Set();
  const raws = [d.vintage && d.vintage.bottle_image_url, d.wine && d.wine.hero_image_url];
  raws.forEach(raw => {
    const url = typeof raw === 'string' ? raw.trim() : '';
    if (!url || seen.has(url)) return;
    const credit = photoCredit(url);
    if (!credit) return;
    seen.add(url);
    out.push({ url, credit });
  });
  return out;
}
function creditText(c){
  if (!c) return '';
  return c.kind === 'producer' ? fill('credit', { name:c.name }) : fill('source', { domain:c.domain });
}

  return String(name || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\./g, '').replace(/\s+/g, ' ');
}
function stripes(dir, parts){
  const total = parts.reduce((s, p) => s + p[1], 0);
  let acc = 0;
  return parts.map(p => {
    const frac = p[1] / total;
    const x = dir === 'v' ? acc * 30 : 0;
    const y = dir === 'h' ? acc * 20 : 0;
    const w = dir === 'v' ? frac * 30 : 30;
    const h = dir === 'h' ? frac * 20 : 20;
    acc += frac;
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+p[0]+'"/>';
  }).join('');
}

}

  let vintageHtml = '';
  if (facts.length || prod || taste || year){
    vintageHtml = '<section class="band"><div class="eyebrow">'+esc(year ? ui('vintage')+' '+year : ui('vintage'))+'</div>'
      + (facts.length ? '<div class="facts" style="margin-top:24px">'+facts.map(([k,val]) => '<div><div class="fact-k">'+esc(k)+'</div><div class="fact-v">'+esc(val)+'</div></div>').join('')+'</div>' : '')
      + (prod ? '<p class="notes">'+esc(prod)+'</p>' : '')
      + (taste ? '<blockquote class="tasting">“'+esc(taste)+'”</blockquote>' : '')
      + '</section>';
  }

  const locality = nonEmpty(w.locality), region = nonEmpty(w.region), country = nonEmpty(w.country);
  const placeLeft = [locality, region].filter(Boolean).join(', ');
  const place = [placeLeft, country].filter(Boolean).join(' · ');
  const flag = country ? flagSvg(country) : '';
  const founded = hasNum(w.founded_year) ? fill('founded',{y:String(Number(w.founded_year))}) : '';
  const tagline = nonEmpty(w.tagline);
  const wineryDesc = nonEmpty(w.description);
  const website = nonEmpty(w.website_url);
  const ownershipConfirmed = !!(d.ownership_confirmed || w.ownership_confirmed);
  const ownershipBadge = nonEmpty(d.ownership_badge || w.ownership_badge);
  const vsKey = nonEmpty(w.verification_status);
  const vsName = vsKey ? (VS[vsKey.toLowerCase()] || VS.under_review) : null;
  const badges = [];
  if (ownershipConfirmed) badges.push('<span class="badge"><span aria-hidden="true">✓</span>'+esc(ownershipBadge || ui('ownFallback'))+'</span>');
  else if (ownershipBadge) badges.push('<span class="badge">'+esc(ownershipBadge)+'</span>');
  if (vsKey) badges.push('<span class="badge"><span class="dot" style="background:'+(VS_DOT[vsKey.toLowerCase()] || VS_DOT.under_review)+'"></span>'+esc(ui('vsPrefix'))+' '+esc(ui(vsName))+'</span>');
  let wineryHtml = '';
  if (wineryName || place || founded || tagline || wineryDesc || badges.length || website){
    wineryHtml = '<section class="band"><div class="eyebrow">'+esc(ui('winery'))+'</div>'
      + (wineryName ? '<h2 class="winery-name">'+esc(wineryName)+'</h2>' : '')
      + (place ? '<div class="place">'+(flag || '')+'<span>'+esc(place)+'</span></div>' : '')
      + (founded ? '<div class="founded">'+esc(founded)+'</div>' : '')
      + (tagline ? '<div class="tagline">'+esc(tagline)+'</div>' : '')
      + (wineryDesc ? '<p class="winery-body">'+esc(wineryDesc)+'</p>' : '')
      + ((badges.length || website) ? '<div class="badge-row">'+badges.join('')+(website ? '<a class="website" href="'+esc(website)+'" target="_blank" rel="noopener">'+esc(website)+'</a>' : '')+'</div>' : '')
      + '</section>';
  }

  const cells = [['family', dna.family],['land', dna.land_story],['philosophy', dna.philosophy],['founding', dna.founding_story]]
    .map(([k, val]) => [ui(k), nonEmpty(val)]).filter(pair => pair[1]);
  const quote = nonEmpty(dna.signature_quote);
  const first = dna.is_first_registered_in_country === true && country ? fill('first',{c:country}) : '';
  let dnaHtml = '';
  if (cells.length || quote || first){
    dnaHtml = '<section class="dna"><div class="eyebrow" style="margin-bottom:32px">'+esc(ui('dna'))+'</div>'
      + (first ? '<p class="first-line">'+esc(first)+'</p>' : '')
      + (quote ? '<blockquote class="dna-quote">“'+esc(quote)+'”</blockquote>' : '')
      + (cells.length ? '<div class="dna-grid">'+cells.map(([k,val]) => '<div><div class="dna-k">'+esc(k)+'</div><div class="dna-v">'+esc(val)+'</div></div>').join('')+'</div>' : '')
      + '</section>';
  }

  const timeline = (Array.isArray(d.timeline) ? d.timeline.slice() : []).sort((a,b) => {
    const ao = Number(a && a.event_order), bo = Number(b && b.event_order);
    if (Number.isFinite(ao) && Number.isFinite(bo) && ao !== bo) return ao - bo;
    return 0;
  });
  const events = timeline.map(e => {
    const label = eventLabel(e && e.event_type);
    const when = formatDate(e && e.occurred_at);
    const text = nonEmpty(e && e.description);
    if (!label && !when && !text) return '';
    return '<div class="tl-item"><div class="tl-dot" aria-hidden="true"></div><div class="tl-head">'+(label ? '<div class="tl-label">'+esc(label)+'</div>' : '<div></div>')+(when ? '<div class="tl-when">'+esc(when)+'</div>' : '')+'</div>'+(text ? '<div class="tl-desc">'+esc(text)+'</div>' : '')+'</div>';
  }).filter(Boolean);
  const timelineHtml = events.length ? '<section class="band"><div class="eyebrow" style="margin-bottom:36px">'+esc(ui('timeline'))+'</div><div class="tl">'+events.join('')+'</div></section>' : '';

  const linkBtns = [];
  if (nonEmpty(v.id)) linkBtns.push('<a class="navbtn" href="'+esc(pageHref('vintage-passport.html',{vintageId:v.id}))+'">'+esc(ui('openVintage'))+'</a>');
  if (nonEmpty(wine.id)) linkBtns.push('<a class="navbtn" href="'+esc(pageHref('wine-passport.html',{wineId:wine.id,winerySlug:w.slug}))+'">'+esc(ui('openWine'))+'</a>');
  if (nonEmpty(w.slug)) linkBtns.push('<a class="navbtn" href="'+esc(pageHref('winery-passport.html',{slug:w.slug}))+'">'+esc(ui('visitWinery'))+'</a>');
  const linksHtml = linkBtns.length ? '<div class="links">'+linkBtns.join('')+'</div>' : '';

  const y = window.scrollY;
  document.getElementById('app').innerHTML = '<article><div class="hero"><div class="plate">'+plateArt+'<div style="text-align:center">'+edition+tokenLine+statusRow+'</div></div>'+(identityBits.length ? '<div class="identity">'+identityBits.join('')+'</div>' : '')+'</div>'+vintageHtml+wineryHtml+dnaHtml+timelineHtml+linksHtml+'</article>';
  window.scrollTo(0, y);
  bindPhotos();
}

function paintActive(){
  if (!lastData) return;
  const photos = livePhotos(lastData);
  if (!photos.length){ renderPassport(lastData); return; }
  if (photoIndex >= photos.length) photoIndex = 0;
  const active = photos[photoIndex];
  const img = document.getElementById('photo-img');
  const credit = document.getElementById('photo-credit');
  const pos = document.getElementById('photo-pos');
  if (img) img.src = active.url;
  if (credit) credit.textContent = creditText(active.credit);
  if (pos) pos.textContent = fill('photoOf',{i:photoIndex+1,n:photos.length});
  document.querySelectorAll('[data-thumb]').forEach(el => el.classList.toggle('is-on', Number(el.getAttribute('data-thumb')) === photoIndex));
}
function retire(url){
  if (!url || failedUrls.has(url)) return;
  failedUrls.add(url);
  const lbImg = document.getElementById('lb-img');
  if (lbImg && lbImg.getAttribute('src') === url) closeLightbox();
  renderPassport(lastData);
}
function bindPhotos(){
  const frame = document.getElementById('photo-frame');
  if (frame) frame.addEventListener('click', openLightbox);
  document.querySelectorAll('[data-thumb]').forEach(el => el.addEventListener('click', () => { photoIndex = Number(el.getAttribute('data-thumb')); paintActive(); }));
  const img = document.getElementById('photo-img');
  if (img) img.addEventListener('error', () => retire(img.getAttribute('src')));
  document.querySelectorAll('[data-thumb-img]').forEach(im => im.addEventListener('error', () => retire(im.getAttribute('src'))));
}
function openLightbox(){
  if (!lastData) return;
  const photos = livePhotos(lastData);
  const active = photos[Math.min(photoIndex, Math.max(photos.length - 1, 0))];
  if (!active) return;
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  img.src = active.url;
  img.alt = ui('photoAlt');
  img.referrerPolicy = 'no-referrer';
  document.getElementById('lb-credit').textContent = creditText(active.credit);
  document.getElementById('lb-close').setAttribute('aria-label', ui('close'));
  lb.hidden = false;
}
function closeLightbox(){
  const lb = document.getElementById('lightbox');
  lb.hidden = true;
  document.getElementById('lb-img').removeAttribute('src');
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
document.getElementById('lb-img').addEventListener('error', () => { const src = document.getElementById('lb-img').getAttribute('src'); if (src) retire(src); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

async function load(){
  if (!token){ renderNotFound(); return; }
  renderLoading();
  let d;
  try {
    const r = await fetch(API + '/scan/' + encodeURIComponent(token));
    if (r.status === 404 || r.status === 400){ renderNotFound(); return; }
    if (!r.ok){ renderError(); return; }
    d = await r.json();
  } catch (e) {
    renderError();
    return;
  }
  renderPassport(d);
}

CAP.wireSwitcher();
CAP.applyStatic();
load();
</script>
