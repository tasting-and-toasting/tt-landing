/* -----------------------------------------------------------------------------
 * Only what belongs to the WINERY and to no other passport. Everything shared
 * lives in src/cap/passport-canon.css and is NOT re-declared here.
 *
 * The winery has no bottle of its own, so it has no hero plate: the canon gives
 * it one full-width opening band with a double wash
 * (docs/design/canon/passport/WineryPassport.dc.html) and the estate's name at
 * display size. Nothing bottle-specific — no token, no copy number, no scan
 * counter, no provenance — may ever appear here.
 * --------------------------------------------------------------------------*/
.wy-hero{padding:48px var(--pad);border-bottom:1px solid var(--line);
  background:radial-gradient(ellipse at 20% 20%,rgba(197,165,114,0.08),transparent 55%),
             radial-gradient(ellipse at 80% 90%,rgba(74,14,20,0.5),transparent 55%)}
@media(min-width:600px){.wy-hero{padding:64px var(--pad) 56px}}
.wy-name{font-family:var(--serif);font-weight:500;font-size:clamp(34px,8vw,56px);line-height:1.02;
  margin:0 0 14px;letter-spacing:-0.015em;color:var(--cream)}

/* A wine in the estate's range: the canon's card, photo leading when the
   producer has supplied one (cap_wines.hero_image_url). */
.wy-wine{display:flex;gap:16px;align-items:center}
.wy-wine-img{height:90px;width:auto;flex:0 0 auto;object-fit:contain;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,0.5))}
.wy-wine-name{font-family:var(--serif);font-size:19px;line-height:1.2;color:var(--cream);margin-bottom:4px}

<main id="app"></main>

<footer class="foot" id="foot"></footer>

<script>
/* -----------------------------------------------------------------------------
 * CAP-PASSPORT-FAMILY-CANON-01 — the winery passport in the approved design
 * system. The REQUEST CONTRACT IS UNCHANGED: the same two endpoints
 * (GET {API}/wineries/{slug} and GET {API}/wineries/{slug}/wines), the same
 * single parameter (?slug=), the same permanent public link
 * (winery-passport.html?slug=…). The wines call stays optional — a failure
 * there must never cost the guest the estate's passport.
 *
 * Every value comes from a field the server really sends, verified in
 * tt-stack api/src/routes/cap.ts (loadWineryBySlug, loadWineryDna,
 * loadWineryServices, loadWineryWines). An empty field hides its row.
 *
 * ONE TRUST CLAIM: the localized "Producer-asserted" (pa_label).
 * `verification_status`, `ownership_confirmed` and `ownership_badge` are NOT
 * rendered — the canon's own rule (docs/design/canon/passport/README.md) and
 * the behaviour of the approved passport (tt-mobile app/v2/cap/bottle.tsx).
 * --------------------------------------------------------------------------*/
const qs = new URLSearchParams(location.search);
const slug = (qs.get('slug') || '').trim();
const lang = CAP.lang;
const t = CAP.t;
const API = qs.get('api') || (/^(localhost|127\.|0\.0)/.test(location.hostname) ? 'http://localhost:8088/api/cap' : 'https://tt-stack-prod.onrender.com/api/cap');
const lp = lang === 'en' ? '' : ('&lang=' + lang);
const ap = qs.get('api') ? ('&api=' + encodeURIComponent(qs.get('api'))) : '';
const keep = lp + ap;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz = v => { const s = (v == null ? '' : String(v)).trim(); return s ? s : null; };

function setCrumbs(parts) {
  document.getElementById('crumbs').innerHTML = parts.map((p, i) =>
    (i ? '<span class="crumb-sep">/</span>' : '') +
    (p.href ? `<a href="${p.href}">${esc(p.label)}</a>`
            : `<span class="${p.current ? 'crumb-current' : ''}">${esc(p.label)}</span>`)
  ).join('');
}

/* A dictionary value, or the raw value when the enum is not one we publish. */
function enumLabel(prefix, raw) {
  const s = nz(raw); if (!s) return null;
  const key = prefix + '_' + s.toLowerCase();
  const out = t(key);
  return out === key ? s : out;
}

/* A service's own name wins, then the producer's free text, then the localized
   type. A type we have no word for is dropped rather than printed raw. */
function serviceLabel(s) {
  const own = nz(s.name) || nz(s.details);
  if (own) return own;
  const type = nz(s.service_type);
  if (!type) return null;
  const out = t('svc_' + type);
  return out === 'svc_' + type ? null : out;
}

/* ---------- states -------------------------------------------------------- */
function stateScreen({ kick, title, body, actions }) {
  document.getElementById('ctx-label').textContent = t('wp_ctx_loading');
  document.getElementById('app').innerHTML = `
    <div class="state fade-in">
      <div class="state-kick">${kick}</div>
      <h1 class="state-title">${title}</h1>
      ${body ? `<p class="state-body">${body}</p>` : ''}
      ${actions || ''}
    </div>`;
  document.getElementById('foot').textContent = 'CAP · Tasting & Toasting';
}
const exploreLink = `<a class="xlink" href="https://tastingandtoasting.com">${t('wp_explore')}</a>`;

function renderLoading() {
  document.getElementById('ctx-label').textContent = t('wp_ctx_loading');
  document.getElementById('app').innerHTML =
    `<div class="state"><div class="state-kick">${t('loading')}</div></div>`;
}
function renderNotFound() {
  stateScreen({ kick: t('wp_nf_kick'), title: t('wp_nf_title'), body: t('wp_nf_body'),
    actions: `<div class="links">${exploreLink}</div>` });
}
function renderError() {
  stateScreen({ kick: t('wp_err_kick'), title: t('wp_err_title'), body: t('wp_err_body'),
    actions: `<div class="links"><button class="btn" id="retry-btn">${t('wp_retry')}</button></div>` });
  document.getElementById('retry-btn').addEventListener('click', () => load());
}

/* ---------- the passport -------------------------------------------------- */
function renderPassport(w, dna, services, wines, winesOk) {
  document.getElementById('ctx-label').textContent = t('wp_ctx_ready');
  setCrumbs([{ label: w.name, current: true }]);

  const place = [nz(w.locality), nz(w.region)].filter(Boolean).join(', ');
  const placeLine = [place, nz(w.country)].filter(Boolean).join(' · ');
  const founded = (w.founded_year != null && String(w.founded_year).trim() !== '')
    ? `${t('founded')} ${w.founded_year}` : null;
  const metaLine = [placeLine, founded].filter(Boolean).join(' · ');

  /* --- DNA band --- */
  const cells = dna ? [
    [t('family'), nz(dna.family)],
    [t('land'), nz(dna.land_story)],
    [t('philosophy'), nz(dna.philosophy)],
    [t('story'), nz(dna.founding_story)],
  ].filter(([, v]) => !!v) : [];
  const dnaQuote = dna ? nz(dna.signature_quote) : null;
  const dnaBand = (cells.length || dnaQuote) ? `
    <section class="band dna">
      <div class="eyebrow">${t('dna_title')}</div>
      ${dnaQuote ? `<blockquote class="dna-quote">${esc(dnaQuote)}</blockquote>` : ''}
      ${cells.length ? `<div class="dna-grid">${cells.map(([k, v]) => `
        <div><div class="dna-k">${esc(k)}</div><div class="dna-v">${esc(v)}</div></div>`).join('')}</div>` : ''}
    </section>` : '';

  /* --- the range: cards, as the canon --- */
  let winesBand = '';
  if (winesOk) {
    const inner = wines.length ? `
      <div class="vintages">${wines.map(wi => {
        const meta = [enumLabel('color', wi.color), nz(wi.style)].filter(Boolean).join(' · ');
        const img = nz(wi.hero_image_url);
        return `<a class="vintage" href="wine-passport.html?wineId=${encodeURIComponent(wi.id)}&winerySlug=${encodeURIComponent(slug)}${keep}">
          <div class="wy-wine">
            ${img ? `<img class="wy-wine-img" src="${esc(img)}" alt="${esc(wi.name)}">` : ''}
            <div>
              <div class="wy-wine-name">${esc(wi.name)}</div>
              ${meta ? `<div class="v-meta">${esc(meta)}</div>` : ''}
            </div>
          </div>
        </a>`;
      }).join('')}</div>` : `
      <div class="v-empty">
        <div class="v-empty-t">${t('wp_wines_empty')}</div>
        <div class="v-empty-s">${t('wp_wines_empty_sub')}</div>
      </div>`;
    winesBand = `
      <section class="band">
        <div class="eyebrow">${t('wines_title')}</div>
        ${inner}
      </section>`;
  }

  /* --- services --- */
  const svc = services.map(serviceLabel).filter(Boolean);
  const svcBand = svc.length ? `
    <section class="band">
      <div class="eyebrow">${t('services_title')}</div>
      <div class="chips">${svc.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>
    </section>` : '';

  document.getElementById('app').innerHTML = `
    <article class="fade-in">
      <section class="wy-hero">
        <div class="eyebrow eyebrow-strong">${t('winery_section')}</div>
        <h1 class="wy-name">${esc(w.name)}</h1>
        ${nz(w.tagline) ? `<p class="producer-tagline">${esc(w.tagline)}</p>` : ''}
        ${metaLine ? `<div class="producer-place">${esc(metaLine)}</div>` : ''}
        ${nz(w.description) ? `<p class="producer-text">${esc(w.description)}</p>` : ''}
        <span class="pa-line">${t('pa_label')}</span>
        ${nz(w.website_url) ? `<a class="site-link" href="${esc(w.website_url)}" target="_blank" rel="noopener">${esc(w.website_url)}</a>` : ''}
      </section>

      ${dnaBand}
      ${winesBand}
      ${svcBand}

      <section class="band">
        <div class="eyebrow eyebrow-muted">${t('wn_coming_label')}</div>
        <div class="demo">
          <div class="demo-badge">${t('wn_demo_badge')}</div>
          <div class="demo-t">${t('wy_dash_title')}</div>
          <div class="demo-b">${t('wy_dash_body')}</div>
          <div class="demo-cta">${t('wy_dash_cta')}</div>
        </div>
      </section>
    </article>`;

  document.getElementById('foot').textContent = 'CAP · Tasting & Toasting';
}

async function load() {
  if (!slug) { renderNotFound(); return; }
  renderLoading();
  let data;
  try {
    const r = await fetch(`${API}/wineries/${encodeURIComponent(slug)}`);
    if (r.status === 404 || r.status === 400) { renderNotFound(); return; }
    if (!r.ok) { renderError(); return; }
    data = await r.json();
  } catch (e) { renderError(); return; }
  if (!data || !data.winery) { renderNotFound(); return; }

  /* The range is a second, optional read: if it fails the estate's passport
     still renders in full, only without the wines band. */
  let wines = [];
  let winesOk = false;
  try {
    const wr = await fetch(`${API}/wineries/${encodeURIComponent(slug)}/wines`);
    if (wr.ok) { wines = (await wr.json()).wines || []; winesOk = true; }
  } catch (e) {}

  renderPassport(data.winery, data.dna || null, data.services || [], wines, winesOk);
}

CAP.wireSwitcher();
CAP.applyStatic();
load();
</script>
