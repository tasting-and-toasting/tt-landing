<style>
  *{box-sizing:border-box;}
  html,body{margin:0;max-width:100%;}
  body{background:#1A0B08;color:#F5F0E8;font-family:'Inter',system-ui,sans-serif;font-weight:400;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:#C5A572;text-decoration:none;}
  a:hover{color:#F5F0E8;}
  img{max-width:100%;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:20px 48px;border-bottom:1px solid rgba(197,165,114,0.16);flex-wrap:wrap;}
  .brand{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:0.02em;color:#C5A572;flex:0 0 auto;}
  .crumb{font-family:'JetBrains Mono',monospace;font-size:11px;color:#C5A572;min-width:0;flex:1 1 160px;overflow-wrap:anywhere;}
  .crumb a{color:#C5A572;}
  .lang-switcher{flex:1 1 280px;max-width:100%;display:flex;justify-content:flex-end;}
  .lang-switcher-flags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;max-width:100%;}
  .lang-flag-link{display:inline-flex;align-items:center;justify-content:center;width:28px;height:18px;border-radius:2px;overflow:hidden;border:1px solid rgba(197,165,114,0.35);opacity:.78;flex:0 0 auto;}
  .lang-flag-link:hover{opacity:1;}
  .lang-flag-link.is-current-lang{opacity:1;border-color:#C5A572;box-shadow:0 0 0 1px rgba(197,165,114,0.35);}
  .lang-flag-link svg{width:100%;height:100%;display:block;}
  .pad{padding:72px 48px;}
  .hero{border-bottom:1px solid rgba(197,165,114,0.16);background:radial-gradient(ellipse at 20% 20%, rgba(197,165,114,0.08), transparent 55%), radial-gradient(ellipse at 80% 90%, rgba(74,14,20,0.5), transparent 55%);}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:#8B7548;margin:0 0 16px;}
  .hero-name{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(36px,5vw,56px);line-height:1.02;margin:0 0 14px;overflow-wrap:anywhere;}
  .tagline{font-family:'Fraunces',serif;font-style:italic;font-size:20px;color:#C5A572;margin:0 0 20px;overflow-wrap:anywhere;}
  .place{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:rgba(245,240,232,0.6);margin:0 0 6px;}
  .place span{overflow-wrap:anywhere;min-width:0;}
  .flag{width:16px;height:11px;display:block;flex:0 0 auto;margin-top:4px;border:1px solid rgba(197,165,114,0.35);}
  .founded{font-size:12px;color:rgba(245,240,232,0.4);margin:0 0 20px;}
  .desc{font-size:15px;line-height:1.6;color:rgba(245,240,232,0.75);max-width:640px;margin:0 0 20px;overflow-wrap:anywhere;}
  .meta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 12px;border:1px solid rgba(197,165,114,0.5);border-radius:2px;color:#C5A572;}
  .website{font-size:13px;color:rgba(245,240,232,0.55);overflow-wrap:anywhere;}
  .section{border-bottom:1px solid rgba(197,165,114,0.12);}
  .dna{background:linear-gradient(180deg,#2E0509 0%,#1A0B08 100%);}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 28px;flex-wrap:wrap;}
  .sec-head .kicker{margin:0;}
  .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(245,240,232,0.45);}
  .dna-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:36px;max-width:1100px;}
  .dna-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(197,165,114,0.6);margin:0 0 10px;}
  .dna-copy{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;line-height:1.5;overflow-wrap:anywhere;}
  .wines-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px;}
  .wine-card{position:relative;border:1px solid rgba(197,165,114,0.22);border-radius:2px;min-width:0;}
  .wine-card:hover{border-color:rgba(197,165,114,0.55);}
  .wine-card-link{display:flex;gap:16px;align-items:center;padding:20px;color:inherit;min-width:0;}
  .wine-card-link:hover{color:#F5F0E8;}
  .wine-visual{width:104px;flex:0 0 104px;min-width:0;}
  .bottle{height:90px;width:auto;display:block;}
  .producer-photo{height:90px;width:auto;max-width:104px;object-fit:contain;display:block;background:transparent;}
  .credit{display:block;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:9px;line-height:1.35;color:rgba(245,240,232,0.62);overflow-wrap:anywhere;}
  .wine-copy{min-width:0;flex:1;}
  .wine-name{font-family:'Fraunces',serif;font-size:19px;margin:0 0 4px;overflow-wrap:anywhere;}
  .wine-meta,.wine-grapes{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(245,240,232,0.45);overflow-wrap:anywhere;}
  .wine-grapes{margin-top:4px;}
  .zoom{position:absolute;top:8px;inset-inline-start:8px;z-index:2;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#C5A572;background:rgba(26,11,8,0.86);border:1px solid rgba(197,165,114,0.45);padding:4px 8px;cursor:pointer;}
  .zoom:hover{color:#F5F0E8;}
  .svc-row{display:flex;gap:10px;flex-wrap:wrap;}
  .svc{font-size:12px;padding:8px 14px;border:1px solid rgba(197,165,114,0.3);border-radius:2px;color:rgba(245,240,232,0.7);overflow-wrap:anywhere;}
  .wines-empty{border:1px dashed rgba(197,165,114,0.3);border-radius:2px;padding:28px 20px;text-align:center;}
  .empty-title{font-size:14px;color:rgba(245,240,232,0.7);margin:0 0 6px;}
  .empty-sub{font-size:13px;color:rgba(245,240,232,0.45);margin:0;}
  .state{min-height:64vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px;gap:18px;}
  .state-kick{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:rgba(197,165,114,0.6);}
  .state-title{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(26px,4vw,32px);max-width:520px;line-height:1.3;margin:0;}
  .state-body{font-size:14px;color:rgba(245,240,232,0.55);max-width:440px;margin:0;}
  .draft-bottle{height:200px;width:auto;opacity:0.8;}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:1px solid rgba(197,165,114,0.45);border-radius:2px;background:transparent;color:#C5A572;font-family:'Inter',system-ui,sans-serif;font-size:13px;letter-spacing:0.04em;cursor:pointer;}
  .btn:hover{color:#F5F0E8;}
  .skel{height:22px;width:min(46%,280px);background:rgba(197,165,114,0.14);border-radius:2px;margin-bottom:14px;animation:wp-pulse 1.4s ease-in-out infinite;}
  .skel.short{width:min(28%,160px);height:12px;}
  @keyframes wp-pulse{0%,100%{opacity:.4}50%{opacity:.9}}
  #lightbox[hidden]{display:none !important;}
  #lightbox{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lb-backdrop{position:absolute;inset:0;background:rgba(15,5,7,0.92);border:0;padding:0;cursor:pointer;}
  .lb-figure{position:relative;z-index:1;margin:0;max-width:min(92vw,720px);display:flex;flex-direction:column;align-items:center;gap:14px;}
  #lb-img{max-width:min(92vw,720px);max-height:72vh;object-fit:contain;display:block;}
  #lb-credit{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.4;color:rgba(245,240,232,0.62);text-align:center;margin:0;overflow-wrap:anywhere;}
  #lb-close{position:absolute;top:16px;inset-inline-end:16px;z-index:2;}
  @media (max-width:720px){
    .topbar{padding:16px;}
    .pad{padding:40px 16px;}
    .dna-copy{font-size:20px;}
    .state{padding:48px 16px;}
  }
</style>

function colorLabel(c){
  var raw = text(c);
  if (!raw) return '';
  var k = raw.toLowerCase();
  if (k === 'ros\u00e9') k = 'rose';
  var key = 'color_' + k;
  var label = CAP.t(key);
  return label === key ? raw : label;
}
function styleLabel(s){
  var raw = text(s);
  if (!raw) return '';
  if (raw.toLowerCase() === 'sparkling') return CAP.t('color_sparkling');
  return raw;
}
function wineCount(n){
  if (lang === 'ru' || lang === 'uk'){
    var n10 = n % 10, n100 = n % 100;
    var word = (n10 === 1 && n100 !== 11) ? '\u0432\u0438\u043d\u043e' : (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) ? '\u0432\u0438\u043d\u0430' : '\u0432\u0438\u043d';
    return n + ' ' + word;
  }
  if (lang === 'pl'){
    if (n === 1) return '1 wino';
    var a = n % 10, b = n % 100;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return n + ' wina';
    return n + ' win';
  }
  if (n === 1) return L('wines_one');
  return L('wines_many').replace('{n}', String(n));
}
function assertedLabel(){
  if (lang === 'en') return 'Producer-asserted';
  return CAP.t('b_claimed');
}
function statusLabel(status){
  if (status === 'verified' || status === 'certified') return CAP.t('b_verified');
  if (status === 'under_review') return CAP.t('b_review');
  if (status === 'documents_submitted') return L('submitted');
  if (status === 'rejected') return CAP.t('b_unverified');
  if (status) return CAP.t('b_review');
  return '';
}
function serviceLabels(services){
  if (!Array.isArray(services)) return [];
  return services.map(function(s){
    if (typeof s === 'string') return text(s);
    if (!s || typeof s !== 'object') return '';
    var custom = text(s.details);
    if (custom) return custom;
    var type = text(s.service_type);
    if (!type) return '';
    var key = 'svc_' + type;
    var label = CAP.t(key);
    return label === key ? type : label;
  }).filter(Boolean);
}
function foundedLine(year){
  var y = text(year);
  if (!y) return '';
  return '<div class="founded">' + esc(CAP.t('founded') + ' ' + y) + '</div>';
}
function placeLine(w){
  var loc = text(w.locality), reg = text(w.region), country = text(w.country);
  var left = [loc, reg].filter(Boolean).join(', ');
  var parts = [left, country].filter(Boolean);
  if (!parts.length) return '';
  return '<div class="place">' + flagSvg(country) + '<span>' + esc(parts.join(' \u00b7 ')) + '</span></div>';
}
function safeHttp(url){
  var u = text(url);
  return /^https?:\/\//i.test(u) ? u : '';
}
function dnaBlock(dna){

function wineCards(wines, winerySlug){
  return wines.map(function(wi){
    var id = text(wi.id);
    if (!id) return '';
    var name = text(wi.name);
    var color = colorLabel(wi.color);
    var style = styleLabel(wi.style);
    var meta = [color, style].filter(Boolean).join(' \u00b7 ');
    var grapes = Array.isArray(wi.grape_varieties) ? wi.grape_varieties.map(text).filter(Boolean).join(', ') : '';
    if (!name && !meta && !grapes) return '';
    var kind = bottleKind(wi);
    var href = pageHref('wine-passport.html', {wineId:id, winerySlug:winerySlug});
    var url = text(wi.hero_image_url);
    var credit = url ? photoCredit(url) : null;
    var line = credit ? creditLine(credit) : '';
    var visual, zoom = '';
    if (url && line){
      visual = '<span class="wine-visual" data-bottle="' + kind + '"><img class="producer-photo" src="' + esc(url) + '" alt="' + esc(name) + '"><span class="credit">' + esc(line) + '</span></span>';
      zoom = '<button type="button" class="zoom" data-url="' + esc(url) + '" data-credit="' + esc(line) + '">' + esc(L('zoom')) + '</button>';
    } else {
      visual = '<span class="wine-visual">' + bottleSvg(kind) + '</span>';
    }
    return '<article class="wine-card">' + zoom +
      '<a class="wine-card-link" href="' + esc(href) + '">' + visual +
      '<span class="wine-copy">' +
        (name ? '<div class="wine-name">' + esc(name) + '</div>' : '') +
        (meta ? '<div class="wine-meta">' + esc(meta) + '</div>' : '') +
        (grapes ? '<div class="wine-grapes">' + esc(grapes) + '</div>' : '') +
      '</span></a></article>';
  }).join('');
}
function winesBlock(wines, winesOk, winerySlug){
  if (!winesOk) return '';
  var cards = wineCards(wines, winerySlug);
  var head = '<div class="sec-head"><div class="kicker">' + esc(CAP.t('wines_title')) + '</div><div class="count">' + esc(wineCount(wines.length)) + '</div></div>';
  var body = cards
    ? '<div class="wines-grid">' + cards + '</div>'
    : '<div class="wines-empty"><p class="empty-title">' + esc(L('wines_empty')) + '</p><p class="empty-sub">' + esc(L('wines_empty_sub')) + '</p></div>';
  return '<section class="section pad">' + head + body + '</section>';
}
function servicesBlock(services){
  var labels = serviceLabels(services);
  if (!labels.length) return '';
  return '<section class="section pad"><div class="kicker">' + esc(L('services')) + '</div><div class="svc-row">' +
    labels.map(function(label){ return '<span class="svc">' + esc(label) + '</span>'; }).join('') +
    '</div></section>';
}
function chipsFor(w, ownershipConfirmed, ownershipBadge){
  var chips = [];
  var status = text(w.verification_status).toLowerCase();
  if (status === 'claimed') chips.push(assertedLabel());
  else {
    var st = statusLabel(status);
    if (st) chips.push(st);
  }
  if (ownershipConfirmed){
    var extra = text(ownershipBadge) || CAP.t('b_verified');
    if (extra && chips.indexOf(extra) === -1) chips.push(extra);
  }
  return chips;
}
function bindPhotos(){
  document.querySelectorAll('img.producer-photo').forEach(function(img){
    img.addEventListener('error', function(){
      var card = img.closest('.wine-card');
      var visual = card && card.querySelector('.wine-visual');
      if (!visual || visual.getAttribute('data-fellback') === '1') return;
      visual.setAttribute('data-fellback', '1');
      visual.innerHTML = bottleSvg(visual.getAttribute('data-bottle'));
      var zoom = card.querySelector('.zoom');
      if (zoom) zoom.remove();
    });
  });
  document.querySelectorAll('.zoom').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      openLb(btn.getAttribute('data-url'), btn.getAttribute('data-credit') || '');
    });
  });
}

  setCrumb('');
  document.getElementById('app').innerHTML =
    '<div class="state"><div class="state-kick">' + esc(L('nf_kick')) + '</div>' +
    '<h1 class="state-title">' + esc(L('nf_title')) + '</h1>' +
    '<p class="state-body">' + esc(L('nf_body')) + '</p>' +
    '<a class="btn" href="https://tastingandtoasting.com">' + esc(L('explore')) + '</a></div>';
}
function renderError(){
  setTitle('');
  setCrumb('');
  document.getElementById('app').innerHTML =
    '<div class="state"><div class="state-kick">' + esc(L('err_kick')) + '</div>' +
    '<h1 class="state-title">' + esc(L('err_title')) + '</h1>' +
    '<p class="state-body">' + esc(L('err_body')) + '</p>' +
    '<button type="button" class="btn" id="retry-btn">' + esc(L('retry')) + '</button></div>';
  document.getElementById('retry-btn').addEventListener('click', function(){ load(); });
}
function renderDraft(){
  setTitle('');
  setCrumb('');
  document.getElementById('app').innerHTML =
    '<div class="state">' + anonBottle() +
    '<div class="state-kick">' + esc(L('draft_kick')) + '</div>' +
    '<h1 class="state-title">' + esc(L('draft_title')) + '</h1>' +
    '<p class="state-body">' + esc(L('draft_body')) + '</p></div>';
}
function renderPassport(w, dna, services, wines, winesOk, ownershipConfirmed, ownershipBadge){
  var name = text(w.name);
  var winerySlug = text(w.slug) || slug;
  setTitle(name);
  setCrumb(name, pageHref('winery-passport.html', {slug: winerySlug}));
  var tagline = text(w.tagline);
  var description = text(w.description);
  var website = safeHttp(w.website_url);
  var chips = chipsFor(w, ownershipConfirmed, ownershipBadge);
  var meta = '';
  if (chips.length || website){
    meta = '<div class="meta-row">' +
      chips.map(function(c){ return '<span class="badge">' + esc(c) + '</span>'; }).join('') +
      (website ? '<a class="website" href="' + esc(website) + '">' + esc(website) + '</a>' : '') +
      '</div>';
  }
  var hero = '<section class="hero pad">' +
    '<div class="kicker">' + esc(L('kick')) + '</div>' +
    (name ? '<h1 class="hero-name">' + esc(name) + '</h1>' : '') +
    (tagline ? '<div class="tagline">' + esc(tagline) + '</div>' : '') +
    placeLine(w) +
    foundedLine(w.founded_year) +
    (description ? '<p class="desc">' + esc(description) + '</p>' : '') +
    meta +
    '</section>';
  document.getElementById('app').innerHTML = hero + dnaBlock(dna) + winesBlock(wines || [], winesOk, winerySlug) + servicesBlock(services);
  bindPhotos();
}
async function load(){
  if (!slug){ renderNotFound(); return; }
  renderLoading();
  var data;
  try {
    var r = await fetch(API + '/wineries/' + encodeURIComponent(slug));
    if (r.status === 404 || r.status === 400){ renderNotFound(); return; }
    if (!r.ok){ renderError(); return; }
    data = await r.json();
  } catch (e) {
    renderError();
    return;
  }
  var w = data && data.winery;
  if (!w || typeof w !== 'object'){ renderError(); return; }
  if (text(w.status).toLowerCase() === 'draft'){ renderDraft(); return; }
  var dna = data.dna || {};
  var services = data.services || [];
  var ownershipConfirmed = !!(data.ownership_confirmed ?? w.ownership_confirmed);
  var ownershipBadge = data.ownership_badge != null ? data.ownership_badge : (w.ownership_badge != null ? w.ownership_badge : null);
  var wines = [];
  var winesOk = false;
  try {
    var wr = await fetch(API + '/wineries/' + encodeURIComponent(slug) + '/wines');
    if (wr.ok){
      var body = await wr.json();
      wines = (body && body.wines) || [];
      winesOk = true;
    }
  } catch (e2) {}
  renderPassport(w, dna, services, wines, winesOk, ownershipConfirmed, ownershipBadge);
}
document.getElementById('lb-close').textContent = L('close');
document.getElementById('lb-close').setAttribute('aria-label', L('close'));
document.getElementById('lb-backdrop').setAttribute('aria-label', L('close'));
document.getElementById('lb-close').addEventListener('click', closeLb);
document.getElementById('lb-backdrop').addEventListener('click', closeLb);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLb(); });
CAP.wireSwitcher();
CAP.applyStatic();
load();
</script>
</body>
