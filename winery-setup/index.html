<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasting & Toasting · Stara Winna Góra · Winery Setup</title>
<style>
/* ========================================================================
   TOKENS  (values taken verbatim from the spec — no new colours introduced)
   ======================================================================== */
:root{
  --bg-deep:#160609;
  --bg-card:#2d0d15;
  --bg-card-2:#3a1520;
  --bg-section:#1a0810;
  --gold:#c9a96e;
  --gold-light:#e8d5a8;
  --cream:#f5efe3;
  --muted:#a08070;
  --muted-2:#7a5a48;
  --muted-3:#5a3a2a;
  --green:#7fb89a;
  --green-solid:#5aa17e;
  --green-bg:rgba(90,161,126,.05);
  --g05:rgba(201,169,110,.05);
  --g06:rgba(201,169,110,.06);
  --g08:rgba(201,169,110,.08);
  --g12:rgba(201,169,110,.12);
  --g18:rgba(201,169,110,.18);
  --g22:rgba(201,169,110,.22);
  --g30:rgba(201,169,110,.30);
  --g35:rgba(201,169,110,.35);
  --g40:rgba(201,169,110,.40);
  --g55:rgba(201,169,110,.55);
  --line:rgba(201,169,110,.08);
  --line-2:rgba(201,169,110,.20);
  --err:#dd8888;
  --err-line:rgba(184,80,66,.5);
  --ink:#1e0810;

  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-deep);
  color:var(--cream);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}
a{color:var(--gold);text-decoration:none;}
a:hover{color:var(--gold-light);}
::selection{background:var(--g30);color:var(--cream);}

.serif{font-family:var(--serif);}
.kicker{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);font-weight:600;
}

/* ========================================================================
   GATE SCREENS  (#gate · #email-gate) — .gate toggled by JS
   ======================================================================== */
.gate{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:56px 24px;
  position:relative;
  background:
    radial-gradient(120% 90% at 50% -10%,rgba(201,169,110,.06),transparent 60%),
    var(--bg-deep);
}
.gate-lang{
  position:absolute;top:22px;right:22px;
  display:flex;gap:6px;
}
.gate-inner{
  width:100%;max-width:340px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
}
#email-gate .gate-inner{max-width:400px;}
.gate-logo{height:42px;width:auto;margin-bottom:26px;opacity:.96;}
.gate-title{
  font-family:var(--serif);
  font-size:27px;font-weight:500;line-height:1.15;
  color:var(--cream);margin:0 0 12px;
  letter-spacing:.005em;
}
.gate-hint{
  font-size:12.5px;line-height:1.55;color:var(--muted);
  margin:0 0 22px;max-width:320px;
}
.gate-err{
  font-size:11px;color:var(--err);min-height:16px;
  margin:0 0 12px;line-height:1.4;
}
/* password input */
.gate-inp{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--g30);
  border-radius:8px;
  padding:14px;
  font-size:22px;
  color:var(--cream);
  text-align:center;
  letter-spacing:8px;
  outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
  margin-bottom:16px;
}
.gate-inp::placeholder{color:var(--muted-3);letter-spacing:4px;}
.gate-inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--g08);}
/* contact fields */
.gate-fields{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.gate-email{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--g30);
  border-radius:8px;
  padding:13px 14px;
  font-size:15px;
  color:var(--cream);
  text-align:left;
  letter-spacing:normal;
  outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.gate-email::placeholder{color:var(--muted-3);}
.gate-email:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--g08);}
/* primary CTA */
.gate-btn{
  width:100%;
  background:var(--gold);
  color:var(--ink);
  border-radius:8px;
  padding:13px;
  font-size:14px;font-weight:600;
  letter-spacing:.02em;
  transition:opacity .15s ease,transform .15s ease;
}
.gate-btn:hover{opacity:.9;}
.gate-btn:active{transform:translateY(1px);}
#email-gate .gate-err{margin-top:10px;}
#email-gate .gate-btn{margin-top:12px;}

/* ========================================================================
   LANG SWITCHER  (.lng · #lbar)
   ======================================================================== */
.lng{
  font-size:11px;font-weight:500;letter-spacing:.08em;
  color:var(--muted);
  background:transparent;
  border:1px solid var(--g18);
  border-radius:4px;
  padding:5px 9px;
  transition:all .15s ease;
}
.lng:hover{color:var(--cream);border-color:var(--g40);}
.lng.on{color:var(--ink);background:var(--gold);border-color:var(--gold);font-weight:600;}

/* ========================================================================
   APP SHELL  (#app)
   ======================================================================== */
#app{max-width:760px;margin:0 auto;}

/* ---- Sticky header ---- */
.hdr{
  position:sticky;top:0;z-index:20;
  background:rgba(45,13,21,.86);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line-2);
  padding:18px 28px 16px;
}
.hdr-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;margin-bottom:16px;
}
.hdr-logo{height:34px;width:auto;}
#lbar{display:flex;gap:6px;}
.hdr-hi{
  font-family:var(--serif);
  font-size:22px;font-weight:500;line-height:1.1;
  color:var(--cream);margin:0 0 6px;letter-spacing:.005em;
}
.hdr-intro{
  font-size:11.5px;line-height:1.55;color:var(--muted);
  margin:0;max-width:620px;
}
/* changed banner */
.banner-changed{
  margin:16px 0 0;
  display:flex;align-items:flex-start;gap:10px;
  background:var(--g08);
  border:1px solid var(--g30);
  border-radius:7px;
  padding:10px 12px;
  font-size:11.5px;line-height:1.5;color:var(--gold-light);
}
.banner-changed .bc-x{
  margin-left:auto;flex:none;
  width:20px;height:20px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:all .15s ease;
}
.banner-changed .bc-x:hover{color:var(--cream);background:var(--g12);}
.banner-changed strong{color:var(--gold);font-weight:600;}
/* completion banner */
.banner-complete{
  margin:16px 0 0;
  display:flex;align-items:center;gap:10px;
  background:var(--green-bg);
  border:1px solid rgba(90,161,126,.4);
  border-radius:7px;
  padding:11px 13px;
  font-size:12px;line-height:1.5;color:var(--green);
}
/* progress */
.progress-row{
  display:flex;align-items:center;gap:12px;
  margin-top:16px;
}
.progress-track{
  flex:1;height:5px;border-radius:3px;
  background:var(--g12);overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  transition:width .4s ease;
}
.progress-pct{
  font-size:10.5px;font-weight:500;letter-spacing:.06em;
  color:var(--gold);white-space:nowrap;
}

/* ---- Body ---- */
.body{padding:28px;}

/* section menu */
#menu{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-bottom:24px;
}
.mitem{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--bg-card);
  border:1px solid var(--g18);
  border-radius:7px;
  padding:7px 11px;
  font-size:11px;
  color:var(--muted);
  position:relative;
  transition:all .15s ease;
}
.mitem .dot{
  width:7px;height:7px;border-radius:50%;flex:none;
  background:var(--g30);transition:background .15s ease;
}
.mitem:hover{border-color:var(--g40);color:var(--cream);}
.mitem.active{border-color:var(--gold);color:var(--cream);background:var(--bg-card-2);}
.mitem.active .dot{background:var(--gold);}
.mitem.done{color:var(--green);}
.mitem.done .dot{background:var(--green-solid);}
.mitem .newdot{
  position:absolute;top:-3px;right:-3px;
  width:6px;height:6px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 2px var(--bg-deep);
}

/* ---- Section view (.sec) ---- */
.sec{margin-bottom:8px;}
.sec-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px;}
.sec-icon{
  width:34px;height:34px;flex:none;
  border-radius:9px;
  background:var(--bg-card-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
}
.sec-icon svg{width:18px;height:18px;}
.sec-kicker{
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);font-weight:600;margin-bottom:3px;
}
.sec-title{
  font-family:var(--serif);
  font-size:23px;font-weight:500;line-height:1.1;
  color:var(--cream);margin:0;letter-spacing:.005em;
}
.sec-intro{
  font-size:11.5px;line-height:1.6;color:var(--muted);
  padding:12px 14px;
  background:var(--g05);
  border-left:2px solid var(--g30);
  border-radius:0 6px 6px 0;
  margin-bottom:24px;
}

/* ---- Question block (.qg) ---- */
.qg{
  margin-bottom:22px;padding-bottom:20px;
  border-bottom:1px solid var(--line);
}
.qg:last-of-type{border-bottom:none;}
.q-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
.q-text{
  font-size:14px;font-weight:500;line-height:1.4;color:var(--cream);
  flex:1;
}
.q-text .q-opt{color:var(--muted-2);font-weight:400;}
/* answered / unanswered badge */
.q-req{
  flex:none;
  font-size:10px;letter-spacing:.06em;
  padding:3px 8px;border-radius:20px;
  color:var(--muted);background:var(--g08);border:1px solid var(--line-2);
  white-space:nowrap;
}
.q-req.ok{color:var(--green);background:var(--green-bg);border-color:rgba(90,161,126,.35);}
/* NEW / UPDATED badges */
.q-tag{
  display:inline-flex;align-items:center;
  font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;margin-left:8px;vertical-align:middle;
}
.q-tag.new{background:var(--gold);color:var(--ink);}
.q-tag.updated{background:transparent;color:var(--gold);border:1px solid var(--g40);}

/* tip */
.tip-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;color:var(--gold);
  padding:4px 0;margin-bottom:10px;
  transition:color .15s ease;
}
.tip-btn:hover{color:var(--gold-light);}
.tip-btn svg{width:12px;height:12px;transition:transform .2s ease;}
.tip-btn.open svg{transform:rotate(180deg);}
.tip-box{
  display:none;
  font-size:11.5px;line-height:1.6;color:#c8b89a;
  background:var(--g06);
  border:1px solid var(--g12);
  border-radius:6px;
  padding:10px 13px;margin-bottom:12px;
}
.tip-box.open{display:block;}

/* option chips (.opt) */
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{
  background:var(--bg-card);
  border:1px solid var(--g22);
  border-radius:20px;
  padding:7px 13px;
  font-size:12.5px;
  color:var(--gold);
  transition:all .15s ease;
}
.opt:hover{border-color:var(--gold);color:var(--cream);}
.opt.on{background:var(--g18);border-color:var(--gold);color:var(--cream);}

/* text / textarea (.inp) */
.inp{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--g22);
  border-radius:6px;
  padding:10px 12px;
  font-size:12.5px;
  color:var(--cream);
  outline:none;
  transition:border-color .15s ease;
}
.inp::placeholder{color:var(--muted-3);}
.inp:focus{border-color:var(--g55);}
textarea.inp{resize:vertical;min-height:88px;line-height:1.55;}

/* file upload zone */
.upl{
  padding:11px 13px;
  background:var(--green-bg);
  border:1px dashed var(--g30);
  border-radius:7px;
}
.upl-btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--g12);
  border:1px solid var(--g35);
  border-radius:6px;
  padding:8px 14px;
  font-size:12.5px;color:var(--gold);
  transition:all .15s ease;
}
.upl-btn:hover{background:var(--g22);color:var(--cream);}
.upl-btn svg{width:14px;height:14px;}
.upl-hint{font-size:10.5px;color:var(--muted-2);margin-top:7px;line-height:1.4;}
.upl-list{display:flex;flex-direction:column;gap:6px;margin-top:9px;}
.file-row{
  display:flex;align-items:center;gap:7px;
  font-size:11px;
  padding:5px 9px;
  background:var(--bg-card);
  border:1px solid var(--g18);
  border-radius:5px;
  color:var(--muted);
}
.file-row svg{width:13px;height:13px;flex:none;}
.file-row .fname{color:var(--cream);}
.file-row .fstat{margin-left:auto;font-size:10px;letter-spacing:.04em;}
.file-row.ok{border-color:rgba(90,161,126,.4);}
.file-row.ok .fstat{color:var(--green);}
.file-row.ok svg{color:var(--green);}
.file-row.err{border-color:var(--err-line);}
.file-row.err .fstat{color:var(--err);}
.file-row .fopen{margin-left:8px;font-size:10.5px;color:var(--gold);}

/* ask-a-question row */
.ask{
  display:flex;flex-direction:column;gap:7px;
  margin-top:8px;
}
.ask-label{font-size:10.5px;color:var(--muted);letter-spacing:.02em;}
.ask-row{display:flex;gap:8px;}
.ask-row .inp{flex:1;}
.ask-btn{
  background:var(--g12);
  border:1px solid var(--g30);
  border-radius:6px;
  padding:0 16px;
  font-size:12.5px;color:var(--gold);
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s ease;
}
.ask-btn:hover{background:var(--g22);color:var(--cream);}
.ask-btn svg{width:13px;height:13px;}

/* prev / next nav */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin:26px 0 8px;
}
.btn-primary{
  background:var(--gold);color:var(--ink);
  border-radius:7px;padding:11px 22px;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:8px;
  transition:opacity .15s ease,transform .15s ease;
}
.btn-primary:hover{opacity:.9;}
.btn-primary:active{transform:translateY(1px);}
.btn-ghost{
  background:transparent;
  border:1px solid var(--g30);
  border-radius:7px;padding:11px 22px;
  font-size:12.5px;color:var(--muted);
  display:inline-flex;align-items:center;gap:8px;
  transition:all .15s ease;
}
.btn-ghost:hover{color:var(--cream);border-color:var(--gold);}
.btn-primary svg,.btn-ghost svg{width:14px;height:14px;}

/* contact row */
.contact-wrap{
  margin-top:6px;padding-top:22px;
  border-top:1px solid var(--line);
}
.contact-kicker{
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);font-weight:600;margin-bottom:14px;
}
#contact{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#contact .inp.full{grid-column:1 / -1;}
.field label{
  display:block;font-size:10.5px;color:var(--muted);
  margin-bottom:5px;letter-spacing:.02em;
}
.field{display:flex;flex-direction:column;}
.field.full{grid-column:1 / -1;}

/* footer */
.footer{
  padding:26px 28px 32px;
  border-top:1px solid var(--g12);
  text-align:center;
}
.footer a{font-size:12.5px;}
.footer .copy{font-size:10.5px;color:#6a4a38;margin-top:8px;}

/* ========================================================================
   STICKY SUBMIT BAR
   ======================================================================== */
.submitbar{
  position:sticky;bottom:0;z-index:15;
  background:rgba(45,13,21,.94);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line-2);
  padding:14px 28px;
  display:flex;align-items:center;gap:16px;
}
#geninfo{
  font-size:10.5px;line-height:1.4;color:var(--muted);flex:1;
}
#geninfo strong{color:var(--gold-light);font-weight:600;}
#genbtn{
  flex:none;
  background:var(--gold);color:var(--ink);
  border-radius:7px;padding:11px 20px;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;
  transition:opacity .15s ease,transform .15s ease;
}
#genbtn:hover{opacity:.9;}
#genbtn:active{transform:translateY(1px);}

/* ========================================================================
   PRIVACY MODAL
   ======================================================================== */
#privacy-modal{
  display:none;
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  align-items:center;justify-content:center;
  padding:24px;
}
#privacy-modal.open{display:flex;}
.pm-card{
  width:100%;max-width:480px;max-height:80vh;overflow-y:auto;
  background:var(--bg-card);
  border:1px solid var(--g30);
  border-radius:12px;
  padding:24px;
}
#pm-ttl{
  font-family:var(--serif);
  font-size:22px;font-weight:500;color:var(--gold);
  margin:0 0 14px;
}
#pm-body{
  font-size:11.5px;line-height:1.7;color:#c8b89a;
  white-space:pre-line;margin:0 0 20px;
}
.pm-close{
  border:1px solid var(--g30);
  border-radius:6px;padding:9px 18px;
  font-size:12.5px;color:var(--muted);
  transition:all .15s ease;
}
.pm-close:hover{color:var(--cream);border-color:var(--gold);}

/* ========================================================================
   NOTIFICATIONS
   ======================================================================== */
#saveflash{
  position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(8px);
  z-index:70;
  background:var(--bg-card-2);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:7px 16px;
  font-size:10.5px;color:var(--gold);letter-spacing:.04em;
  display:inline-flex;align-items:center;gap:7px;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
}
#saveflash svg{width:12px;height:12px;}
#saveflash.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast{
  position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-8px);
  z-index:70;
  background:var(--bg-card-2);
  border:1px solid var(--gold);
  border-radius:10px;
  padding:14px 22px;
  font-size:12.5px;color:var(--cream);line-height:1.4;
  max-width:min(90vw,420px);
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ========================================================================
   RESPONSIVE  (≤700px)
   ======================================================================== */
@media (max-width:700px){
  .hdr{padding:14px 16px 12px;}
  .body{padding:16px;}
  .submitbar{padding:12px 16px;flex-direction:column;align-items:stretch;}
  #genbtn{width:100%;padding:13px;}
  .footer{padding:22px 16px 28px;}
  #contact{grid-template-columns:1fr;}
  .nav{flex-direction:column-reverse;}
  .btn-primary,.btn-ghost{width:100%;justify-content:center;padding:13px;}
  .ask-row{flex-direction:column;}
  .ask-btn{padding:11px;justify-content:center;}
  .sec-title{font-size:21px;}
  .hdr-hi{font-size:20px;}
  .gate-inner{max-width:100%;}
}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-lang" id="glbar"></div>
  <div class="gate-card">
    <img src="/assets/logo_nav.png" alt="Tasting & Toasting">
    <div class="gate-ttl" id="g-ttl"></div>
    <div class="gate-hint" id="g-hint"></div>
    <input class="gate-inp" id="g-inp" type="text" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <div class="gate-err" id="g-err"></div>
    <button class="gate-btn" id="g-btn" onclick="checkGate()"></button>
  </div>
</div>

  pl:{title:"Wprowadź swój email",hint:"Twoje odpowiedzi zapiszą się pod tym adresem i będą dostępne z każdego urządzenia",btn:"Kontynuuj",err:"Wprowadź poprawny adres email",offline:"Brak połączenia z serwerem — używam zapisanej kopii."},

function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
let loadedEmail='';      // email whose data is currently loaded (for switch detection)

// Question versioning (Variant A — JSON in repo): QV maps qid->version,
// badges maps qid->'new'|'updated' computed once per load.

const KEY='tt_marek_winery_v1';
let state=loadState();
if(!state.token)state.token='swg-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
if(!state.files)state.files={};

function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||{ans:{},name:'',email:'',phone:'',domain:'',winery:'',files:{}};}catch(e){return {ans:{},email:'',name:'',phone:'',domain:'',winery:'',files:{}};}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
// localStorage stays as a fast offline cache; the server (keyed by email) is the
// source of truth. Every saveState writes the cache and debounce-syncs the server.
function saveState(){persist();flash();saveToServer();}

// --- Server persistence (keyed by email) -----------------------------------
let _saveTimer=null;
function saveToServer(){
  if(!state.email||!validEmail(state.email))return; // need a valid email key
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async()=>{
    try{
      const r=await fetch(SAVE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:state.email,token:state.token,answers:state.ans,files:state.files,seen:state.seen||{}})});
      const j=await r.json().catch(()=>null);
      if(j&&j.ok)flash();
    }catch(e){/* offline → localStorage cache already has it */}
  },800);
}
async function loadFromServer(email){
  try{
    const r=await fetch(LOAD_ENDPOINT+'?email='+encodeURIComponent(email));
    const j=await r.json();
    if(j&&j.ok&&j.found){
      state.ans=j.answers||{};
      state.files=j.files||{};
      state.seen=j.seen||{};
      if(j.token)state.token=j.token;
    }else if(j&&j.ok){ // found:false → fresh start for this email
      state.ans={};state.files={};delete state.seen;
    }
    state.email=email;persist();
  }catch(e){
    // network error → fall back to whatever is cached locally; non-blocking notice
    state.email=email;persist();
    toast((EMAILSCR[lang]||EMAILSCR.en).offline);
  }
}
// Switch the form to a given (already validated, lowercased) email.
async function applyEmail(email){
  loadedEmail=email;
  await questionsReady;
  if(!DATA){renderFail();return;}
  await loadFromServer(email);
  renderForm();
}

function submitEmail(){
  const winery=(document.getElementById('e-winery').value||'').trim();

// --- Question versioning ----------------------------------------------------
// Compute new/updated badges once at load, from the seen-version snapshot.
// First-ever run (no state.seen yet): record current versions silently,
// show no badges. Later runs: a question missing from seen is "new"; a
// question whose seen version is older than its current v is "updated".
function computeBadges(){
  badges={};
  const firstRun = !state.seen || Object.keys(state.seen).length===0;
  if(firstRun){
    state.seen={};
    SECTIONS.forEach(s=>s.qs.forEach(q=>{state.seen[q.id]=q.v||1;}));
    persist();
    return;
  }
  SECTIONS.forEach(s=>s.qs.forEach(q=>{
    const v=q.v||1, seen=state.seen[q.id];
    if(seen===undefined) badges[q.id]='new';
    else if(seen<v) badges[q.id]='updated';
  }));
}
// Mark a single question as seen at its current version (on answer).
function markSeenQ(qid){ if(!state.seen)state.seen={}; if(QV[qid]!=null) state.seen[qid]=QV[qid]; }
// Mark all questions in a section as seen (on opening/viewing it).
function markSectionSeen(i){ const s=SECTIONS[i]; if(!s)return; if(!state.seen)state.seen={}; s.qs.forEach(q=>{state.seen[q.id]=QV[q.id]||q.v||1;}); persist(); saveToServer(); }
function changedCount(){ return Object.keys(badges).length; }
function sectionHasBadge(s){ return s.qs.some(q=>badges[q.id]); }
function flash(){const f=document.getElementById('saveflash');f.textContent=UI[lang].save;f.classList.add('show');clearTimeout(window._ft);window._ft=setTimeout(()=>f.classList.remove('show'),1200);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),3500);}

function isAnswered(qid){const v=state.ans[qid];const hasFile=(state.files[qid]||[]).length>0;if(hasFile)return true;if(v==null)return false;if(Array.isArray(v))return v.length>0;return String(v).trim().length>0;}
function sectionDone(sec){return sec.qs.every(q=>isAnswered(q.id));}
function countProgress(){let total=0,done=0;SECTIONS.forEach(s=>s.qs.forEach(q=>{total++;if(isAnswered(q.id))done++;}));return {total,done,pct:Math.round(done/total*100)};}

    let h='<div class="sec-hd"><div class="sec-ico">'+iconSvg(s.icon)+'</div><div><div class="sec-no">'+UI[lang].menu+' '+(i+1)+' '+UI[lang].of+' '+SECTIONS.length+'</div><div class="sec-ttl">'+s.title[lang]+'</div></div></div>';
    h+='<div class="sec-intro">'+s.intro[lang]+'</div>';
    s.qs.forEach(q=>{h+=renderQ(q);});
    h+='<div class="ask"><div class="ask-lbl">'+UI[lang].ask+'</div><div class="ask-row"><input class="inp" id="ask-'+s.id+'" placeholder="..."><button class="ask-btn" onclick="sendAsk(\''+s.id+'\',\''+s.title[lang].replace(/'/g,"")+'\')">'+UI[lang].asksend+'</button></div></div>';
    h+='<div class="nav">';
    h+= i>0?'<button class="btn btn-ghost" onclick="goSec('+(i-1)+')">'+UI[lang].prev+'</button>':'<span></span>';
    h+= i<SECTIONS.length-1?'<button class="btn" onclick="goSec('+(i+1)+')">'+UI[lang].next+'</button>':'<span></span>';
    h+='</div>';
    sec.innerHTML=h;
    wrap.appendChild(sec);
  });
  bindInputs();renderAllFiles();
}
function renderQ(q){
  const ans=state.ans[q.id];const answered=isAnswered(q.id);
  let h='<div class="qg" data-qid="'+q.id+'">';
  const bd=badges[q.id];
  const bdHtml=bd?'<div class="q-badge '+(bd==='new'?'new':'upd')+'">'+(bd==='new'?UI[lang].new:UI[lang].updated)+'</div>':'';
  h+='<div class="q-top"><div class="q-txt">'+q.q[lang]+'</div><div style="display:flex;gap:6px;align-items:center;flex-shrink:0">'+bdHtml+'<div class="q-req'+(answered?' ok':'')+'">'+(answered?UI[lang].answered:UI[lang].unanswered)+'</div></div></div>';
  h+='<button class="tip-btn" onclick="toggleTip(this)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'+UI[lang].tip+'</button>';
  h+='<div class="tip-box">'+q.tip[lang]+'</div>';
  if(q.type==='single'||q.type==='multi'){
    h+='<div class="opts">';
    q.opts[lang].forEach((o,idx)=>{
      let on=false;
      if(q.type==='single')on=ans===idx;else on=Array.isArray(ans)&&ans.includes(idx);
      h+='<span class="opt'+(on?' on':'')+'" data-qid="'+q.id+'" data-idx="'+idx+'" data-type="'+q.type+'">'+o+'</span>';
    });
    h+='</div>';
  }else if(q.type==='text'||q.type==='number'){
    h+='<input class="inp" data-qid="'+q.id+'" type="'+(q.type==='number'?'number':'text')+'" value="'+(ans!=null?String(ans).replace(/"/g,'&quot;'):'')+'" placeholder="...">';
  }else if(q.type==='textarea'){
    h+='<textarea class="inp" data-qid="'+q.id+'" rows="2" placeholder="...">'+(ans!=null?String(ans):'')+'</textarea>';
  }
  if(UPLOAD_QS[q.id]){
    const uu=UPLOAD_UI[lang];
    h+='<div class="upl"><label class="upl-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'+UPLOAD_QS[q.id][lang]+'<input type="file" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" multiple style="display:none" onchange="handleUpload(event,\''+q.id+'\')"></label><div class="upl-hint">'+uu.hint+'</div><div class="upl-list" id="files-'+q.id+'"></div></div>';
  }
  h+='</div>';
  return h;
}
function bindInputs(){
  document.querySelectorAll('.opt[data-qid]').forEach(el=>{
    el.onclick=()=>{
      const qid=el.dataset.qid, idx=+el.dataset.idx, type=el.dataset.type;
      if(type==='single'){state.ans[qid]=idx;}
      else{if(!Array.isArray(state.ans[qid]))state.ans[qid]=[];const a=state.ans[qid];const p=a.indexOf(idx);if(p>=0)a.splice(p,1);else a.push(idx);}
      markSeenQ(qid);saveState();renderSections();renderMenu();renderProgress();
    };
  });
  document.querySelectorAll('input.inp[data-qid],textarea.inp[data-qid]').forEach(el=>{
    el.oninput=()=>{state.ans[el.dataset.qid]=el.value;markSeenQ(el.dataset.qid);saveState();updateQBadge(el.dataset.qid);renderProgress();};
    el.onblur=()=>{renderMenu();};
  });
}
function updateQBadge(qid){const g=document.querySelector('.qg[data-qid="'+qid+'"] .q-req');if(!g)return;const ok=isAnswered(qid);g.classList.toggle('ok',ok);g.textContent=ok?UI[lang].answered:UI[lang].unanswered;}
function toggleTip(btn){btn.nextElementSibling.classList.toggle('open');}
function goSec(i){cur=i;markSectionSeen(i);renderSections();renderMenu();window.scrollTo({top:0,behavior:'smooth'});}

function renderAllFiles(){SECTIONS.forEach(s=>s.qs.forEach(q=>{if(UPLOAD_QS[q.id])renderFiles(q.id);}));}
function renderFiles(qid){
  const box=document.getElementById('files-'+qid);if(!box)return;
  const list=state.files[qid]||[];box.innerHTML='';
  list.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='upl-file'+(f.status==='ok'?' ok':'')+(f.status==='err'?' err':'');
    let st=f.status==='ok'?UPLOAD_UI[lang].done:(f.status==='err'?UPLOAD_UI[lang].err:UPLOAD_UI[lang].uploading);
    let openLink=f.signed_url||f.url;
    d.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c9a96e" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg><span class="nm">'+f.name+'</span><span class="st">'+st+'</span>'+(f.status==='ok'&&openLink?' <a class="open" href="'+openLink+'" target="_blank">↗</a>':'');
    box.appendChild(d);
  });
}
async function handleUpload(ev,qid){
  const files=[...ev.target.files];ev.target.value='';
  if(!state.files[qid])state.files[qid]=[];
  for(const file of files){
    if(!['application/pdf','image/jpeg','image/png'].includes(file.type)){toast(UPLOAD_UI[lang].err+': '+file.name);continue;}
    if(file.size>15*1024*1024){toast(UPLOAD_UI[lang].err+': >15MB');continue;}
    const rec={name:file.name,status:'up'};
    state.files[qid].push(rec);renderFiles(qid);
    try{
      const fd=new FormData();
      // Text fields MUST be appended BEFORE the file: the backend reads them
      // from file.fields, which only contains parts that arrive before the file
      // in the multipart stream. With the file first, a large upload streams
      // before token/question are parsed -> backend sees them missing -> 400.
      fd.append('token',state.token);fd.append('question',qid);fd.append('original_name',file.name);fd.append('file',file);
      const r=await fetch(UPLOAD_ENDPOINT,{method:'POST',body:fd});
      const j=await r.json();
      if(j.ok){rec.status='ok';rec.url=j.url;rec.signed_url=j.signed_url||null;}
      else{rec.status='err';}
    }catch(e){rec.status='err';}
    markSeenQ(qid);saveState();renderFiles(qid);renderMenu();renderProgress();updateQBadge(qid);
  }
}

function iconSvg(name){
  const I={'ti-plant-2':'<path d="M3 17h18M5 17c0-5 5-7 7-7M19 12c0 2-2 5-7 5M12 22V10"/>','ti-flask':'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>','ti-list-numbers':'<path d="M11 6h10M11 12h10M11 18h10M4 6h1v4M4 10h2M6 18H4l2-3H4"/>','ti-qrcode':'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/>','ti-users':'<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.5a4 4 0 0 1 0 7M21 21v-2a4 4 0 0 0-3-3.8"/>','ti-shield-check':'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6zM9 12l2 2 4-4"/>','ti-stamp':'<path d="M8 9V6a4 4 0 0 1 8 0v3M5 21h14M6 21v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/>','ti-books':'<path d="M5 4h3v16H5zM10 4h3v16h-3zM16 5l3 .8L16 21l-3-.8z"/>','ti-shopping-cart':'<path d="M6 6h15l-2 9H8zM6 6L5 3H3M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>','ti-glass-full':'<path d="M8 21h8M12 15v6M6 3h12l-1 7a5 5 0 0 1-10 0zM6 7h12"/>','ti-calendar':'<path d="M4 5h16v16H4zM4 9h16M8 3v4M16 3v4"/>'};
  return '<svg viewBox="0 0 24 24">'+(I[name]||'')+'</svg>';
}

function buildSummary(){
  const lines=['WINERY: '+(state.winery||'—'),'PARTNER: '+(state.name||'—'),'PHONE: '+(state.phone||'—'),'DOMAIN: '+(state.domain||'—'),'EMAIL: '+(state.email||'—'),'TOKEN: '+state.token,'LANG: '+lang.toUpperCase()];
  const p=countProgress();lines.push('PROGRESS: '+p.done+'/'+p.total+' ('+p.pct+'%)','');
  SECTIONS.forEach((s,i)=>{
    // Build this section's answered questions first; only print the header
    // (and the section) if at least one question has an answer or a file.
    const secLines=[];
    s.qs.forEach(q=>{
      const a=state.ans[q.id];let av='—';
      if(q.type==='single'&&a!=null)av=q.opts[lang][a];
      else if(q.type==='multi'&&Array.isArray(a)&&a.length)av=a.map(x=>q.opts[lang][x]).join(', ');
      else if((q.type==='text'||q.type==='textarea'||q.type==='number')&&a!=null&&String(a).trim())av=String(a);
      const okFiles=(state.files[q.id]||[]).filter(f=>f.status==='ok');
      // Skip unanswered questions with no uploaded files entirely.
      if(av==='—'&&okFiles.length===0)return;
      secLines.push('Q: '+q.q[lang]);secLines.push('A: '+av);
      okFiles.forEach(f=>{secLines.push('FILE: '+f.name+' → '+(f.signed_url||f.url));});
      secLines.push('');
    });
    if(secLines.length===0)return; // whole section empty → no header
    lines.push('━━━ '+(i+1)+'. '+s.title[lang]+' ━━━');
    lines.push(...secLines);
  });
  return lines.join('\n');
}
// Сообщение об успехе показывается ТОЛЬКО при фактической доставке.
// Тексты неудачи держим здесь, чтобы не трогать чужой questions.json.
const SEND_ERR={
  pl:{t:'Nie wysłano.',b:'Nic nie zostało dostarczone — Twoje odpowiedzi zostały na tej stronie. Spróbuj ponownie albo napisz na info@tastingandtoasting.com'},
  en:{t:'Not sent.',b:'Nothing was delivered — your answers are still on this page. Try again or write to info@tastingandtoasting.com'},
  ru:{t:'Не отправлено.',b:'Ничего не доставлено — ваши ответы остались на этой странице. Попробуйте ещё раз или напишите на info@tastingandtoasting.com'}
};
function sendErr(){ return SEND_ERR[lang]||SEND_ERR.en; }

async function sendAll(){
  const summary=buildSummary();const p=countProgress();
  const wasSubmitted=!!(state.submitted);
  const payload={type:'winery_setup',winery:state.winery||'',token:state.token,name:state.name||'',phone:state.phone||'',domain:state.domain||'',email:state.email||'',lang:lang,progress:p.pct+'%',updated:wasSubmitted,answers:state.ans,files:state.files,summary:summary,url:location.href,ts:new Date().toISOString()};
  // Наш сервер — вспомогательный сток, его неудача не решает, дошло письмо или нет.
  try{ const rs=await fetch('https://tt-stack-prod.onrender.com/api/partner-interest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); if(!rs.ok) console.warn('partner-interest код',rs.status); }
  catch(e){ console.warn('partner-interest не принял:',e); }
  // Канал доставки.
  let delivered=false;
  try{
    const r=await fetch('https://formspree.io/f/xgobjyre',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'Winery setup: '+(state.winery||'Winery')+' ('+p.pct+'%)'+(payload.updated?' [UPDATED]':''),name:payload.name,email:payload.email,summary:summary})});
    delivered=r.ok;
    if(!r.ok) console.warn('доставка отклонена, код',r.status);
  }catch(e){ console.warn('доставка не состоялась:',e); }
  if(delivered){ state.submitted=true; persist(); toast(UI[lang].sent+' '+UI[lang].sentb); }
  else { const e=sendErr(); toast(e.t+' '+e.b); }
}
async function sendAsk(secId,secTitle){
  const inp=document.getElementById('ask-'+secId);const txt=inp.value.trim();if(!txt)return;
  let delivered=false;
  try{
    const r=await fetch('https://formspree.io/f/xgobjyre',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'Question from '+(state.name||state.winery||'Winery')+' — '+secTitle,name:state.name||'',email:state.email||'',question:txt,section:secTitle})});
    delivered=r.ok;
    if(!r.ok) console.warn('вопрос не доставлен, код',r.status);
  }catch(e){ console.warn('вопрос не доставлен:',e); }
  if(delivered){ inp.value=''; toast(UI[lang].asksend+' ✓'); }
  else { const e=sendErr(); toast(e.t+' '+e.b); }
}

function openPrivacy(){document.getElementById('pm-ttl').textContent=PRIVACY[lang].title;document.getElementById('pm-body').textContent=PRIVACY[lang].body;document.getElementById('privacy-modal').classList.add('open');}
function closePrivacy(){document.getElementById('privacy-modal').classList.remove('open');}

function renderGate(){const p=PWD[lang];document.getElementById('g-ttl').textContent=p.title;document.getElementById('g-hint').textContent=p.hint;document.getElementById('g-btn').textContent=p.enter;}
function checkGate(){
  const v=document.getElementById('g-inp').value.trim();
  if(v===ACCESS_CODE){document.getElementById('gate').style.display='none';document.getElementById('email-gate').style.display='flex';renderEmailScreen();document.getElementById('e-inp').focus();try{sessionStorage.setItem('tt_gate','1');}catch(e){}}
  else{document.getElementById('g-err').textContent=PWD[lang].err;document.getElementById('g-inp').value='';}
}

const FAIL_MSG={pl:"Nie udało się załadować pytań. Odśwież stronę.",en:"Could not load the questions. Please refresh.",ru:"Не удалось загрузить вопросы. Обновите страницу."};

const lb=document.getElementById('lbar');
['pl','en','ru'].forEach(l=>{
  ['lbar','glbar','elbar'].forEach(function(bid){
    const container=document.getElementById(bid);if(!container)return;
    const b=document.createElement('button');
    b.className='lng'+(l==='pl'?' on':'');
    b.dataset.l=l;b.textContent=l.toUpperCase();
    b.onclick=()=>{lang=l;
      document.querySelectorAll('.lng').forEach(x=>x.classList.toggle('on',x.dataset.l===l));
      renderGate();renderEmailScreen();if(DATA&&loadedEmail)renderLang();};

  });
});

document.getElementById('g-inp').addEventListener('keydown',e=>{if(e.key==='Enter')checkGate();});
document.getElementById('e-inp').addEventListener('keydown',e=>{if(e.key==='Enter')submitEmail();});
renderGate();
// After the access-code gate (or a restored session) we show the EMAIL screen,
// not the form — the form is keyed by email and only renders once one is entered.
try{if(sessionStorage.getItem('tt_gate')==='1'){document.getElementById('gate').style.display='none';document.getElementById('email-gate').style.display='flex';renderEmailScreen();}}catch(e){}

// Questions live in a versioned JSON file (Variant A). Load them in the
// background; the form renders only after an email is entered (applyEmail).
let questionsReady = fetch('/winery-setup/questions.json',{cache:'no-cache'})
  .then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .then(d=>{
    DATA=d;SECTIONS=DATA.sections;UI=DATA.ui;
    SECTIONS.forEach(s=>s.qs.forEach(q=>{QV[q.id]=q.v||1;}));
  })
  .catch(err=>{ DATA=null; });
